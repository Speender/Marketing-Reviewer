  ['Retiring a brand','Phasing out brands that no longer fit the portfolio.']
 ],
 notes:[
  {h:'1. Long-term view', html:'<p>Any marketing action can change consumer knowledge. Those changes also affect how consumers respond to future marketing. Past responses shape awareness and image, which shape current responses, which shape future responses.</p>', v:[
    {t:'flow', title:'The chain of brand knowledge over time', steps:[['Consumer response to past marketing'],['Brand awareness and brand image'],['Consumer response to current marketing'],['Changed brand awareness and image'],['Consumer response to future marketing']]}]},
  {h:'2. Reinforcing brands', html:'<p>Tools: maintain <b>consistency</b> (in the amount and nature of marketing support); <b>protect sources of equity</b> (keep the brand relevant; innovate in product design, manufacturing, merchandising; continuity in meaning with changes in tactics); manage the <b>trade-off between fortifying and leveraging</b>; <b>fine-tune</b> the supporting program. Guiding questions: What products does the brand represent? What benefits? What needs? How does the brand make products superior? What strong, favorable, unique associations exist?</p>'},
  {h:'3. Revitalizing brands', html:'<p>Two objectives: expand the depth and breadth of awareness; improve the strength, favorability and uniqueness of associations (existing or new).</p>', v:[
    {t:'mind', title:'Revitalization strategy map', center:'Revitalizing a brand', branches:[

      ['Improve image',['Refresh old sources of equity','Create new sources of equity','Bolster fading associations; neutralize negative ones','Create new associations']],
      ['Customers',['Retain vulnerable customers','Recapture lost customers','Identify neglected segments','Attract new customers']]]}],
   html2:''},
  {h:'4. Image and market strategies', html:'<p><b>Repositioning</b> may establish more compelling PODs; sometimes the key POD is nostalgia and heritage rather than a product difference; other times a missing POP must be established. <b>Changing brand elements</b> signals new meaning. <b>Back to basics</b> (product, pricing, channel, communication) taps existing equity (Harley-Davidson). <b>Create new sources</b> (Mountain Dew). <b>Entering new markets</b>: abandon the old supporting segment and target a new one.</p><p>Increasing usage: communicate appropriateness of more frequent use in current situations, send reminders, and find new uses.</p>'},
  {h:'5. Adjustments to the brand portfolio', html:'<p><b>Migration strategies</b>: a logically ordered hierarchy helps customers move up (BMW 3-, 5-, 7-series). <b>Acquiring new customers</b>: balance spend on new versus existing customers; proactively attract younger customers. <b>Retiring brands</b>.</p>'}
 ],
 ph:[
  ['Increasing frequency','A brand of instant noodles positioned only as a rainy-day meal could promote it as merienda or study-night food to raise frequency (illustrative).'],
  ['New uses','Back-of-pack recipes that show a canned meat product in breakfast sandwiches or fried rice find new uses without changing the product.'],
  ['Heritage as a POD','A decades-old local biscuit or soft drink can lean on nostalgia and \"lola\'s pantry\" memories to differentiate from newer rivals.'],
  ['Migration','A mobile operator tries to move prepaid users to postpaid plans as incomes rise; a ladder of tiers makes the step feel natural.']
 ],
 confused:[

  ['Fortifying versus leveraging','Fortifying = invest in the brand. Leveraging = harvest/use its equity.'],

  {h:'1. Regional and demographic segments', html:'<p>Reasons for regional marketing: need for more focused targeting; shift from national advertising to sales promotions. Drawbacks: production headaches, lower marketing efficiency and higher costs. Other segments: age groups (bringing younger consumers into the franchise) and ethnic segments (slide: Asians and Hispanics were 79 million of 281 million people in the US, about $1 trillion of annual purchasing power).</p>'},

  {h:'3. Standardization versus customization', html:'<p>Levitt argued the world is shrinking, so well-managed companies should offer globally standardized, advanced, functional, reliable and low-priced products. In practice firms blend global objectives with local concerns: <b>"Think global. Act local."</b> A global brand keeps the same positioning and benefits and tailors when needed.</p>', v:[

  {h:'4. Building a global brand', html:'<p>Identify differences in consumer behavior (how they buy and use products; what they know and feel about brands), then adjust the program: choice of brand elements, nature of the supporting program, leverage of secondary associations. Questions to ask: How valid is the mental map in the new market? What is the level of awareness? How valuable are the associations? What changes are needed? How should the new map be created?</p><p>Global CBBE needs breadth and depth of awareness, POPs and PODs, positive accessible responses and intense active relationships. The six building blocks are salience, performance, imagery, responses (judgments), feelings and resonance.</p>'},
  {h:'5. Ten commandments of global branding', html:'<ol class="tight"><li>Understand similarities and differences in the global branding landscape.</li><li>Do not take shortcuts in brand building.</li><li>Establish marketing infrastructure.</li><li>Embrace integrated marketing communications.</li><li>Cultivate brand partnerships.</li><li>Balance standardization and customization.</li><li>Balance global and local control.</li><li>Define operable guidelines.</li><li>Implement a global brand equity measurement system.</li><li>Leverage brand elements.</li></ol>'}

 notes:[
  {h:'1. Summary of the framework', html:'<p>Brand knowledge structure = brand awareness (depth and breadth) plus brand associations. Sources of equity: strength, favorability and uniqueness. Outcomes: greater loyalty; less vulnerability to competitive actions and crises; larger margins; more inelastic response to price increases and more elastic response to price decreases; greater trade cooperation; more effective communications; licensing opportunities; extension opportunities.</p>'},
  {h:'2. Tactical guidelines', html:'<p>Build equity through (1) the initial choice of brand elements, (2) marketing activities and program design, (3) leveraging secondary associations. <b>Building</b>: mix and match elements; create a rich image and high perceived quality; value-based pricing; a range of distribution options; mix communication options; leverage secondary associations. <b>Measuring</b>: formalize the firm\'s view; conduct inventories; conduct tracking; assemble outcome measures; establish a department to oversee. <b>Managing</b>: define hierarchy; create global associations; introduce extensions; set portfolio roles; reinforce and enhance equity over time; identify consumer differences across segments.</p>'},
  {h:'3. Strong brand managers and the seven deadly sins', html:'<p>Strong managers understand brand meaning and market appropriately; position properly; deliver benefits superbly; use a full range of complementary elements and activities; embrace IMC with a consistent voice; measure perceived value and price accordingly; establish credibility and personality; maintain innovation and relevance; design hierarchy and portfolio; implement a brand equity management system.</p>', v:[
    {t:'flow', title:'Seven deadly sins of brand management', numbered:true, arrows:false, steps:[['Failure to understand the full meaning of the brand'],['Failure to live up to the brand promise'],['Failure to adequately support the brand'],['Failure to be patient with the brand'],['Failure to adequately control the brand'],['Failure to balance consistency and change'],['Failure to understand the complexity of equity measurement and management']]}]},
  {h:'4. Specialized contexts', html:'', v:[
    {t:'mind', title:'Guidelines by context', center:'Special branding guidelines', branches:[
      ['Industrial and B2B',['Corporate or family branding','Link non-product imagery','Full range of communication options','Leverage customers\' equity','Segment carefully']],
      ['High-tech',['Awareness and rich image','Corporate credibility','Secondary associations of quality','Avoid overbranding','Selectively launch new brands; flag extensions']],
      ['Service',['Maximize service quality','Full range of elements for recall','Strong organizational associations','Communications that augment the service encounter','Hierarchy with family, individual and ingredient brands']],
      ['Retailers',['Hierarchy: store and departments','Enhance manufacturers\' equity by communicating PODs','Equity at all levels','Multichannel shopping experience','Avoid overbranding']],
      ['Small business',['One or two strong brands','One or two key associations','Integrated elements','Creative push campaigns','Leverage as many secondary associations as possible']],
      ['Online',['Do not forget the basics','Strong identity','Generate consumer pull','Selective partnerships','Maximize relationship marketing']]]}]},
  {h:'5. Future priorities and marketing balance', html:'<p>Twenty-first-century brands will: rely on brand elements to do more of the selling; build programs that surpass consumer expectations; formalize measurement of their own and competitors\' sources of equity; and align internal and external brand management and top-down with bottom-up management.</p>', v:[
    {t:'flow', title:'Three levels of marketing balance (increasing effectiveness)', steps:[['Alternate','Take turns: emphasize one side of a trade-off, then the other'],['Divide','Pursue both at once with separate programs or segments'],['Finesse','Find an approach that removes the trade-off altogether']]}]}
 ],
 ph:[
  ['Service branding','A bank or airline cannot show its product before purchase, so it leans on staff behavior, names, logos and a consistent experience to build recall and trust.'],
  ['Small business branding','A Cebu lechon brand that builds its name around one clear association (flavor) is an example of focusing on one or two key associations.'],
  ['Online branding','E-wallets and e-commerce apps still need clear identity, relevant offers and good service. The basics of brand building do not disappear online.'],
  ['Retailers','Supermarkets and malls own a store brand but also carry manufacturers\' brands; each should communicate its PODs without over-branding.'],
  ['Marketing balance','A premium restaurant that also wants to be affordable can alternate (promos in slow months), divide (a value menu and a main menu) or finesse (smaller portions at lower prices with the same quality).']
 ],
 confused:[
  ['Complementarity versus consistency','Complementarity = elements fill each other\'s gaps. Consistency = elements say the same thing.'],
  ['Internal versus external brand management','Internal = employees and partners understand the brand. External = consumers\' needs are met and exceeded.'],
  ['Alternate versus divide versus finesse','Alternate = take turns. Divide = split between segments or programs. Finesse = remove the trade-off. Finesse is the most effective.']
 ],
 mnemonics:[
  ['Marketing balance','Always Do Finesse','Alternate, Divide, Finesse (ascending effectiveness).'],
  ['Seven sins','Unwise Leaders Skip Patience, Control, Balance and Measurement','Understand meaning, Live up to promise, Support, Patience, Control, Balance consistency and change, complexity of Measurement.']
 ],
 takeaways:['Equity comes from awareness and strong, favorable, unique associations and pays off in loyalty, margins and flexibility.','Three levers: elements, programs, secondary associations.','Avoid the seven sins.','Align internal and external management; aim to finesse trade-offs.']
});

CH.push({
 course:'ad', n:1, short:'Introduction to IMC', title:'An Introduction to Integrated Marketing Communications', priority:'High-yield',

 notes:[
  {h:'1. A changing media environment', html:'<p>The deck opens with Google: keyword-targeted text ads paid per click (CPC), and contextual or site-targeted ads paid per thousand impressions (CPM). Audiences are harder to target; consumers are no longer passive and seek information from many sources. Traditional mass media now drive people to websites, and online strategies must inform, entertain and interact.</p>'},

     ['Publicity / PR',['Publicity vehicles: news releases, feature articles, interviews, press conferences, special events','PR tools: cause marketing, sponsorship, community activities, corporate advertising']],
     ['Personal selling',['Person-to-person','Assist and persuade the buyer']]]}],
   tbl:{title:'Advertising versus publicity', cols:['Factor','Advertising','Publicity'], rows:[['Control','Great','Little'],['Credibility','Lower','Higher'],['Reach','Measurable','Undetermined'],['Frequency','Schedulable','Uncontrollable'],['Cost','High/specific','Low/unspecified'],['Flexibility','High','Low'],['Timing','Specifiable','Tentative']]}},
  {h:'5. Why sales promotion takes a big share', html:'<p>Most of the promotional budget now goes to sales promotion because of declining brand loyalty, greater consumer sensitivity to deals, and larger, more powerful retailers demanding trade promotion support.</p>'},
  {h:'6. The IMC planning process', html:'<p>Planning requires planning, executing, evaluating and controlling.</p>', v:[

 ph:[
  ['IMC in a Philippine launch','A new snack might combine TV and YouTube ads (advertising), Facebook and TikTok content (interactive), "buy 2 get 1" packs (sales promotion), a mall sampling booth (promotion and event), and a press launch (publicity), with all pieces using the same message and look.'],
  ['Primary versus selective demand','A dairy industry campaign urging Filipinos to drink more milk is primary demand. An ad saying one milk brand is creamier is selective demand.'],

CH.push({

 ],
 notes:[
  {h:'1. Marketing and promotions process model', html:'<p>Opportunity analysis and competitive analysis lead to target marketing (identify markets, segment, select, position). Marketing strategy is then expressed through product, pricing, channel and promotional decisions. Promotion goes to the final buyer (consumers and businesses) and to the trade (resellers). Under Armour\'s success came from niche markets, strong positioning, a unique identity and strong reputation.</p>'},
  {h:'2. Segmentation and targeting', html:'<p>The segmentation process: group consumers by needs; group the marketing actions available; build a market/product grid; select target segments; take marketing actions. Then decide how many segments to enter and which have the greatest potential.</p>', v:[

  {h:'4. Product, price and channel decisions', html:'<p><b>Branding and packaging</b> are linked product decisions: names communicate attributes (Safeguard, Easy-Off, I Can\'t Believe It\'s Not Butter!), advertising builds equity, and the package is often the customer\'s first exposure. <b>Price</b>: consumers give up money, time, mental activity and behavioral effort; price must match perceptions. Higher prices signal quality; a high-quality positioning with a lower price than competitors will confuse customers. <b>Channels</b> involve selecting, managing and motivating intermediaries (brokers, distributors, wholesalers, retailers).</p>', v:[
    {t:'flow', title:'Push versus pull', numbered:false, arrows:true, steps:[['Push policy','Producer promotes to wholesaler, wholesaler to retailer, retailer to consumer'],['Pull policy','Producer promotes to consumers; consumers ask retailers; retailers order from wholesalers and producer']]}]}
 ],

  ['Benefit segmentation','Shampoo brands in the Philippines separate anti-dandruff, anti-frizz, and color-protect benefit segments, each with its own advertising.'],
  ['Positioning by cultural symbols','Brands that use Filipino family values, fiesta imagery or the barong and terno are positioning with cultural symbols.'],
  ['Price consistency','A "premium" coffee brand sold cheaper than mass brands may confuse buyers: the price contradicts the quality position.']
 ],
 confused:[

 terms:[

  {h:'3. Information search and perception', html:'<p>Sources: personal, market (ads, salespeople), public, and personal experience. Perception process: receive, select, organize, interpret. Marketers use sensory tactics (color, scent strips, samples). Probing techniques: in-depth interviews, association tests, projective techniques, focus groups.</p>', v:[
    {t:'flow', title:'Selective perception filters', steps:[['Selective exposure','Choose whether to be exposed'],['Selective attention','Focus on some stimuli and ignore others'],['Selective comprehension','Interpret in line with existing beliefs'],['Selective retention','Remember only some information']]}]},
  {h:'4. Alternative evaluation and attitudes', html:'<p>From all available brands, consumers form an <b>evoked set</b>. They judge with evaluative criteria. Marketers see a product as a bundle of attributes; consumers see it as a set of functional and psychological outcomes. The multiattribute model explains attitudes; marketers can change attitudes by (1) changing beliefs about an important attribute, (2) changing the perceived importance of an attribute, (3) adding a new attribute, (4) changing beliefs about a competing brand.</p>'},
  {h:'5. Purchase, postpurchase and learning', html:'<p>Integration uses decision rules and heuristics (affect referral). Purchase intention leads to purchase and possibly brand loyalty. Postpurchase: satisfaction, dissatisfaction, or cognitive dissonance. <b>Classical conditioning</b> pairs the brand with a positive stimulus (music, imagery). <b>Operant conditioning</b> rewards behavior (good product performance, samples, rebates) to raise repeat purchase. <b>Cognitive learning</b> sees behavior as goal-directed problem solving with insight.</p>'},
  {h:'6. External influences and new approaches', html:'<p>Culture, subculture, social class, reference groups and situational determinants. Alternative research approaches (interviews, participant observation, ethnographies) add social, cultural and environmental insight.</p>'}
 ],

  ['Maslow in Philippine ads','Insurance and pre-need plans appeal to safety; family-meal ads to social belonging; luxury cars and condos to esteem.'],
  ['Reference groups','Barkada (peer group) and family strongly shape what young Filipinos buy, which is why ads show group settings and influencer endorsements.'],
  ['Cognitive dissonance','After buying an expensive phone, a buyer reads reviews that confirm the choice; brands send reassurance messages to reduce dissonance.']
 ],
 confused:[
  ['Classical versus operant conditioning','Classical: learning by association (brand plus pleasant stimulus). Operant: learning by consequences (reward after use).'],
  ['Selective exposure versus selective attention','Exposure: whether you encounter the message at all. Attention: whether you focus on it once exposed.'],
  ['Evoked set versus all available brands','The evoked set is the smaller group actually considered.'],
  ['Motive versus attitude','A motive drives action; an attitude is a learned predisposition toward an object.']
 ],
 mnemonics:[
  ['Decision process','Pretty Interesting Answers Produce Points','Problem recognition, Information search, Alternative evaluation, Purchase decision, Postpurchase evaluation.'],
  ['Matching processes','My Pet Always Itches Loudly','Motivation, Perception, Attitude formation, Integration, Learning.'],
  ['Maslow, bottom up','Please Stop Saying Embarrassing Stuff','Physiological, Safety, Social, Esteem, Self-actualization.'],
  ['Selective perception','EACR: Every Ad Can Register','Exposure, Attention, Comprehension, Retention.']
 ],
 takeaways:['Five decision stages each pair with a psychological process.','Perception is selective at four points.','Attitudes are learned and can be changed four ways.','Learning can be behavioral (classical, operant) or cognitive.','Culture, class, groups and situations shape decisions.']
});

CH.push({
 course:'ad', n:5, short:'The communication process', title:'The Communication Process', priority:'High-yield',
 overview:'How communication works and how consumers respond: the basic model (source, encoding, message, channel, decoding, receiver, noise, feedback), semiotics, response hierarchy models, the FCB grid, cognitive responses and the Elaboration Likelihood Model.',

 terms:[
  ['Source','The person or organization that has information to share.'],
  ['Encoding','Putting thoughts, ideas or information into symbolic form: verbal, graphic, musical, animation.'],
  ['Channel','Method by which the message travels: personal (word of mouth, personal selling) or nonpersonal (print, broadcast).'],
  ['Decoding','Transforming the sender\'s message back into thought.'],
  ['Noise','Unplanned distortion or interference in the communication process.'],

  ['Buzz marketing','Word-of-mouth generated by consumers, often seeded by marketers.'],
  ['Hierarchy of effects','Awareness, knowledge, liking, preference, conviction, purchase.'],
  ['FCB grid','Planning model that classifies products by involvement and by thinking versus feeling.'],

 ],
 notes:[
  {h:'1. The basic model', html:'<p>Communication is complex and often unsuccessful. A source encodes a message, sends it through a channel, the receiver decodes it, responds, and gives feedback, all amid noise. Success requires an appropriate source, a properly encoded message, the right channel and feedback.</p>', v:[
    {t:'flow', title:'A basic model of communication', steps:[['Source','Who shares the information'],['Encoding','Verbal, graphic, musical, animation'],['Message and channel','Personal or nonpersonal'],['Decoding','Receiver interprets'],['Receiver','Target audience'],['Response and feedback','Noise can distort any step']]}]},
  {h:'2. Meaning, channels and the audience', html:'<p>Semiotics studies how signs and symbols take on meaning; images can convey more than words (the model, clothes, setting, statement and tagline of a Levi\'s ad). Overlap in sender and receiver field of experience ranges from "different worlds" to high commonality. Audiences range from mass markets to segments, niches, and individual and group audiences.</p>'},
  {h:'3. Response hierarchies', html:'<p>Beyond the slides (the slide shows the models as an image): the textbook\'s traditional models are AIDA (attention, interest, desire, action); hierarchy of effects (awareness, knowledge, liking, preference, conviction, purchase); innovation adoption (awareness, interest, evaluation, trial, adoption); information processing (presentation, attention, comprehension, yielding, retention, behavior). All move through cognitive, affective and behavioral stages.</p>', tbl:{title:'Alternative response hierarchies (slide)', cols:['Model','When','Order'], rows:[['Standard learning model','High involvement, high product differentiation','Cognitive &rarr; Affective &rarr; Conative'],['Dissonance/attribution model','High involvement, low differentiation','Conative &rarr; Affective &rarr; Cognitive'],['Low-involvement model','Low involvement','Cognitive &rarr; Conative &rarr; Affective']]}},
  {h:'4. The FCB planning model', html:'', v:[
    {t:'matrix', title:'FCB grid', rows:['High involvement','Low involvement'], cols:['Thinking','Feeling'], cells:[['Informative: the Thinker','Learn, feel, do. Cars, appliances, insurance'],['Affective: the Feeler','Feel, learn, do. Jewelry, fashion, cosmetics'],['Habit formation: the Doer','Do, learn, feel. Household items, food staples'],['Self-satisfaction: the Reactor','Do, feel, learn. Beer, snacks, candy']], axisNote:'The learn/feel/do sequences and product examples are standard textbook additions; the slide shows the four quadrant names. Options: rational versus emotional appeals, raising involvement, or evaluating a think-type product on feelings.'}]},
  {h:'5. Cognitive responses and ELM', html:'<p>Cognitive response research has consumers write down thoughts after seeing an ad. Counterarguments lower acceptance; support arguments raise it; source derogation and bolstering concern the spokesperson; ad execution thoughts shape attitude toward the ad.</p>', v:[
    {t:'flow', title:'Elaboration Likelihood Model', numbered:false, arrows:true, steps:[['High ability and motivation','Central route: close attention to message content and arguments; more enduring attitude change'],['Low ability and motivation','Peripheral route: reliance on cues (celebrity endorser, music, pictures); temporary attitude change']]}]}
 ],
 ph:[
  ['Field of experience','An ad full of Cebuano slang lands well in Cebu but may confuse Ilocano or Tagalog viewers: limited overlap in field of experience.'],
  ['FCB in practice','A housing loan is a Thinker product (long, informative ads). Instant noodles are a Doer or Reactor product (short reminder ads, promos at the store).'],
  ['ELM and endorsers','A popular actor in a shampoo ad works as a peripheral cue for viewers with low involvement.']
 ],
 confused:[
  ['Encoding versus decoding','Sender encodes; receiver decodes.'],
  ['Standard learning versus dissonance/attribution','Standard: learn, then feel, then act. Dissonance: act first, then form attitudes, then learn to support the choice.'],
  ['Central versus peripheral route','Central = message arguments with high elaboration. Peripheral = cues with low elaboration.'],
  ['Source derogation versus counterarguments','Derogation attacks the spokesperson; counterarguments attack the message claims.']
 ],
 mnemonics:[
  ['Hierarchy of effects','A Kid Likes Pizza Called Pepperoni','Awareness, Knowledge, Liking, Preference, Conviction, Purchase.'],
  ['FCB quadrants','Think, Feel, Do, React','High-think = Thinker; high-feel = Feeler; low-think = Doer; low-feel = Reactor.'],
  ['ELM','Central = Content; Peripheral = Pretty cues','High involvement looks at content; low involvement looks at cues.']
 ],

});

CH.push({
 course:'ad', n:6, short:'Source, message and channel', title:'Source, Message, and Channel Factors', priority:'High-yield',

 terms:[

  ['Q-score','Ratio of people who rate a celebrity as a favorite to those who have heard of them.'],

  ['One-sided vs two-sided message','One-sided presents only positives; two-sided includes positives and negatives.'],

 notes:[
  {h:'1. The persuasion matrix', html:'<p>Planners ask: Who will get attention (source)? What message creates favorable attitudes (yielding)? Which media increase presentation (channel)? Can the receiver comprehend the ad?</p>'},
  {h:'2. Source characteristics', html:'', tbl:{cols:['Source attribute','Components','Process'], rows:[['Credibility','Expertise, trustworthiness','Internalization'],['Attractiveness','Similarity, familiarity, likability','Identification'],['Power','Perceived control, concern, scrutiny','Compliance']]}, v:[
    {t:'flow', title:'Choosing a celebrity endorser: factors', numbered:false, arrows:false, steps:[['Match with audience'],['Match with product'],['Image'],['Cost'],['Trust'],['Risk'],['Familiarity'],['Likability']]}]},
  {h:'3. Celebrity endorsers', html:'<p>Risks: the celebrity overshadows the product; overexposure reduces credibility; the audience may not be receptive; the celebrity\'s behavior can create risk. Meaning movement (McCracken): meanings move from the culture to the celebrity, to the product, to the consumer. Q-scores (sports stars average about 17, performers about 18) and fame index databases help selection. Decorative models apply likability. Credible sources have limits: high- and low-credibility sources are equally effective when arguing against their own interest, and the sleeper effect raises low-credibility persuasiveness over time.</p>'},
  {h:'4. Message structure and appeals', html:'<p>Structure decisions (beyond the slides, since these appear as titles only): <b>order of presentation</b> (primacy and recency: recall is highest at the beginning and end); <b>conclusion drawing</b> (explicit conclusions suit less involved or less educated audiences; open-ended works for involved, sophisticated audiences); <b>message sidedness</b> (two-sided is more credible with educated or opposed audiences); <b>refutation</b>; and <b>verbal versus visual</b> elements.</p>', tbl:{title:'Message appeal options (slide)', cols:['Appeal','Key points'], rows:[['Comparative','Especially useful for new brands and brands with small share; common in politics'],['Fear','Stresses physical danger, health or social threats; can backfire if threat is too high (protection motivation)'],['Humor','Attracts and holds attention, often best remembered, positive mood; may hurt comprehension and wear out faster']]}},
  {h:'5. Humor: pros and cons', html:'', tbl:{cols:['Pros','Cons'], rows:[['Aids attention and awareness','Does not aid persuasion in general'],['May aid retention','May harm recall and comprehension'],['Positive mood, enhances persuasion','May harm complex copy registration'],['May aid name and simple copy registration','Does not aid source credibility'],['Distracts, reducing counterarguing','Not effective at bringing about sales; may wear out faster']]}},
  {h:'6. Channel factors', html:'<p>Personal channels are flexible, powerful and real-time; nonpersonal channels reach large audiences but are static. Self-paced media (newspapers, magazines, direct mail, Internet) suit complex messages; externally paced media (radio, TV) limit processing. Context, editorial environment and <b>clutter</b> also affect reception.</p>'}
 ],
 ph:[
  ['Credibility','A doctor or dentist endorsing toothpaste uses expertise; the message is internalized.'],
  ['Attractiveness','Teleserye stars and K-pop idols in Philippine ads work through identification and likability.'],
  ['Celebrity risk','When an endorser is involved in a scandal, brands often pull ads quickly because the celebrity\'s behavior transfers to the brand.'],
  ['Fear appeal','Anti-smoking graphic warnings on cigarette packs use fear; if too extreme, viewers may tune them out.']
 ],
 confused:[
  ['Internalization versus identification','Internalization: accept because the credible source\'s view fits your beliefs. Identification: accept to be like an attractive source.'],
  ['Two-sided versus refutational','Two-sided mentions negatives; refutational raises an opposing claim and then refutes it.'],
  ['Primacy versus recency','Primacy: first items remembered; recency: last items remembered.'],
  ['Self-paced versus externally paced','Self-paced = the reader controls speed (print). Externally paced = the medium controls (TV, radio).']
 ],
 mnemonics:[
  ['Source and process','C-I, A-I, P-C','Credibility-Internalization, Attractiveness-Identification, Power-Compliance.'],
  ['Attractiveness','SFL: Similar, Familiar, Likable','The three parts of source attractiveness.']
 ],
 takeaways:['Credible, attractive and powerful sources persuade through different processes.','Celebrities bring attention and risk.','Message structure and appeal choice depend on audience and involvement.','Channel pace and clutter affect processing.']

 why:'Why it ranks high: deception elements, puffery, the FTC\'s remedies and the pros and cons of self-regulation are classic definitions. The Philippine regulators are added for local context.',

 know:['Self-regulation pros: encourages truthful ads, effective, can be stricter than law, preferable to government. Critics: slow, underfunded, self-serving, lacks power.','Deception: <mark>likely to mislead</mark>, judged from a <mark>reasonable consumer</mark>, and <mark>material</mark>.','Unfairness: substantial injury, not reasonably avoidable, not outweighed by benefits.','Puffery: subjective praise, superlatives, no specific facts (legal).','FTC preventive: affirmative disclosure, ad substantiation. After the fact: cease-and-desist orders, corrective advertising.'],
 terms:[
  ['Self-regulation','Voluntary regulation by advertisers, agencies, industry associations, business (BBB) and media to maintain trust and limit government interference.'],
  ['NAD / NARB','National Advertising Division and National Advertising Review Board: U.S. self-regulatory bodies under the National Advertising Review Council.'],
  ['FTC','Federal Trade Commission, created in 1914; the Wheeler-Lea Amendment (1938) made deceptive practices unlawful.'],
  ['FCC','Federal Communications Commission (1934): regulates broadcast communications.'],
  ['Deceptive advertising','A representation likely to mislead a reasonable consumer that is material to the purchase decision.'],
  ['Unfairness','Practice causing substantial injury that consumers cannot reasonably avoid and that is not outweighed by benefits.'],
  ['Puffery','Praise using subjective opinions, superlatives or exaggerations that state no specific facts (e.g., "The ultimate driving machine").'],
  ['Affirmative disclosure','Requiring ads to disclose certain limitations or deficiencies.'],
  ['Advertising substantiation','Requiring advertisers to have support for their claims before running them.'],
  ['Cease-and-desist order','Order to stop a deceptive practice.'],
  ['Corrective advertising','Ads required to correct a false impression created by earlier ads.'],
  ['Lanham Act','Allows suits against competitors for false advertising.'],
  ['Robinson-Patman Act','Requires trade allowances and co-op funds to be offered on equal, non-discriminatory terms.'],
  ['COPPA','Children\'s Online Privacy Protection Act: restricts collecting information from children online and requires posted privacy policies.']
 ],
 notes:[
  {h:'1. Self-regulation', html:'<p>Ads are regulated through self-regulation, federal regulation and state regulation. Self-regulators: advertisers and agencies, trade associations, the Better Business Bureau, NAD/NARB, and media (e.g., TV network guidelines for children\'s ads: no over-glamorizing, no "ask mom to buy", generally no celebrities or comparative claims, no "only" or "just" for price).</p>', tbl:{cols:['Advertisers, agencies, media view','Critics\' view'], rows:[['Encourages truthful, ethical, responsible ads','Takes too long to resolve complaints'],['Effective regulatory mechanism','Budget and staffing problems'],['Can be stricter than legislation','Self-serving to advertisers and media'],['Preferable to government intervention','Lacks power or authority']]}},
  {h:'2. Federal regulation and the FTC', html:'<p>The First Amendment protects truthful commercial speech, balanced against interests such as harmful products. The FTC has divisions for consumer protection, economics and competition; it was very active in the 1970s, less so in the 1980s and 1990s, and now focuses on enforcing existing rules.</p>', v:[
    {t:'matrix', title:'FTC tools against deceptive advertising', rows:['Prevent','Correct'], cols:['Tool 1','Tool 2'], cells:[['Affirmative disclosure','Disclose limitations or deficiencies'],['Advertising substantiation','Prove claims before running'],['Cease-and-desist orders','Stop the practice'],['Corrective advertising','Correct the false impression']]}]},
  {h:'3. Other agencies and suits', html:'<ul class="tight"><li><b>FCC</b>: broadcast communications (founded 1934).</li><li><b>FDA</b>: food, drug and cosmetic labeling and ads (e.g., Nutrition Labeling and Education Act).</li><li><b>ATF</b>: liquor laws, regulations, taxes and advertising.</li><li><b>U.S. Postal Service</b>: lotteries, obscenity and fraud by mail.</li><li><b>Lanham Act</b>: to win, show false statements, actual or likely deception of a substantial segment, materiality, interstate commerce, and injury.</li><li><b>States</b>: special rules for specific industries.</li></ul>'},
  {h:'4. Regulation of promotion, direct marketing and the Internet', html:'<p>Contests and sweepstakes cannot require purchase and must disclose rules; premiums cannot misrepresent value; care with children. Trade allowances must comply with Robinson-Patman. Telemarketing: Telephone Consumer Protection Act (1991), pay-per-call rule, FTC Do-Not-Call Registry (excludes political groups, charities, surveys and existing relationships; fines up to $11,000 per incident). Internet issues: spam, privacy, protecting children (COPPA).</p>'},
  {h:'5. Philippine context (beyond the slides)', html:'<p>The slides follow U.S. law. In the Philippines, advertising self-regulation is handled by the <b>Ad Standards Council (ASC)</b>, which screens ads against its code. Government regulators include the <b>Department of Trade and Industry (DTI)</b>, which enforces the Consumer Act of the Philippines (RA 7394) on deceptive sales acts and issues permits for sales promotions, and the <b>Food and Drug Administration (FDA Philippines)</b> for food, drug and cosmetic advertising. Verify specifics against current sources if your exam covers local law.</p>'}
 ],
 ph:[
  ['Puffery','"The best-tasting coffee in town" is puffery: subjective and not provable, so generally not deceptive.'],
  ['Substantiation','A whitening soap claiming "visibly whiter in 7 days" must be able to support that specific claim.'],
  ['Promo rules','A raffle that says "no purchase necessary" and discloses mechanics follows promotion rules; in the Philippines a DTI permit number usually appears on the promo materials.']
 ],
 confused:[
  ['Deception versus puffery','Deception is a material, misleading factual claim. Puffery is vague praise with no specific facts.'],
  ['Cease-and-desist versus corrective advertising','Cease-and-desist stops the ad. Corrective advertising fixes the lasting false impression.'],
  ['Affirmative disclosure versus substantiation','Disclosure adds information about limitations. Substantiation requires proof of claims.'],
  ['FTC versus FCC','FTC: unfair and deceptive practices. FCC: broadcasting.']
 ],
 mnemonics:[
  ['Deception test','Mislead, Reasonable, Material','Likely to mislead a reasonable consumer about something material.'],
  ['FTC tools','Before: Disclose and Substantiate. After: Cease and Correct','Two preventive, two corrective.']
 ],
 takeaways:['Self-regulation and government regulation work together.','Deception needs likely misleading, reasonable consumer and materiality; puffery is allowed.','The FTC prevents with disclosure and substantiation and corrects with orders and corrective ads.','Promotions, telemarketing and online marketing have their own rules.']

  {h:'2. Ethics, deception and offensiveness', html:'<p>Not all issues can be regulated. Concerns: general mistrust of ads; abuses in contests, sweepstakes and premiums; deceptive mail order, telemarketing and direct marketing; Internet scams. Offensive or tasteless ads: shock ads (e.g., Benetton\'s "Death Row"), objectionable products, sexual appeals.</p>'},

 {ch:[2], q:'Explain the Customer-Based Brand Equity pyramid. Apply it to a brand you know well (for example a fast-food, telecom or beverage brand).', model:'<p>The CBBE pyramid has <b>four steps</b> that answer four customer questions, built from <b>six blocks</b>. Step 1, <b>identity</b> (Who are you?): <b>salience</b>, the depth and breadth of awareness. Step 2, <b>meaning</b> (What are you?): <b>performance</b> (functional) and <b>imagery</b> (extrinsic, psychological and social). Step 3, <b>response</b> (What about you?): <b>judgments</b> (head: quality, credibility, consideration, superiority) and <b>feelings</b> (heart: warmth, fun, excitement, security, social approval, self-respect). Step 4, <b>relationships</b> (What about you and me?): <b>resonance</b> (loyalty, attachment, community, engagement). Strong brands build the rational and emotional routes. In the application, give one concrete example for each block.</p>', rubric:['Names all four steps and the four questions','Names all six blocks in the correct order','Gives sub-dimensions for at least three blocks','Distinguishes the rational route from the emotional route','Applies each block to a real brand with an example','Explains why resonance is the goal']},
 {ch:[12], q:'Discuss the advantages and disadvantages of brand extensions and describe how a firm should evaluate an extension opportunity.', model:'<p><b>Advantages</b>: facilitate new product acceptance, improve image, reduce perceived risk, improve the odds of gaining distribution and trial, increase promotional efficiency, reduce launch costs, avoid the cost of a new brand, allow packaging efficiencies, permit variety seeking; and feedback benefits to the parent (clarify meaning, enhance image, bring new customers, revitalize, permit more extensions). <b>Disadvantages</b>: confusion or frustration, retailer resistance, failure that hurts the parent, success that cannibalizes the parent, diminished identification with a category, harm to the parent image, dilution of meaning, forgoing the chance to build a new brand. <b>Evaluation</b>: (1) define actual and desired consumer knowledge, (2) identify candidates, (3) evaluate potential, (4) design the launch program, (5) evaluate success and effects on the parent. Fit matters, and the whole knowledge structure must be considered, not a single association.</p>', rubric:['Gives at least four advantages','Gives at least four disadvantages','Mentions benefits or harm to the parent brand','Lists the five evaluation steps in order','Mentions fit or similarity','Warns against focusing on one association']},
 {ch:[8,10], q:'Explain the brand value chain and compare two approaches to measuring the value of a brand.', model:'<p>The <b>brand value chain</b> traces how marketing creates value through four stages: <b>marketing program investment</b>, <b>customer mindset</b> (awareness, associations, attitudes, attachment, activity), <b>market performance</b> (price premiums, elasticity, share, expansion success, cost structure, profitability) and <b>shareholder value</b> (stock price, P/E, market cap). Three multipliers determine how much value moves between stages: <b>program quality</b> (clear, relevant, distinctive, consistent), <b>customer</b> (competitive superiority, channel support, customer size and profile) and <b>market</b> (market dynamics, growth potential, risk profile, brand contribution). To compare two measurement approaches, use for example <b>brand-based comparative</b> (blind testing: isolates brand value but limited to the applications examined) and <b>Interbrand valuation</b> (NPV of forecast brand earnings: gives a financial value useful for M&amp;A but needs many assumptions), or <b>marketing-based</b> and <b>conjoint</b>.</p>', rubric:['Names the four value stages in order','Names the three multipliers','Gives at least two items under customer mindset or market performance','Describes two measurement approaches','States an advantage and a disadvantage for each approach','Links measurement to accountability (ROMI)']}

 {ch:[5], q:'Compare the traditional response hierarchy with the alternative hierarchies and the FCB grid. How should they guide message strategy?', model:'<p>The standard learning hierarchy (cognitive, affective, conative) fits high-involvement, differentiated products. The dissonance/attribution model (conative, affective, cognitive) fits high involvement with little differentiation: people buy, then justify. The low-involvement hierarchy (cognitive, conative, affective) fits routine products: light learning, trial, then attitude. The FCB grid crosses involvement with thinking versus feeling: Thinker (informative), Feeler (affective), Doer (habit), Reactor (self-satisfaction). Message strategy follows: detailed rational copy for Thinkers; emotional imagery for Feelers; reminders and promotions for Doers; sensory, fun cues for Reactors.</p>', rubric:['Describes the standard learning hierarchy','Describes the dissonance/attribution hierarchy','Describes the low-involvement hierarchy','Names all four FCB quadrants','Links each to a message strategy','Gives an example']},

function reveal(box){

    (weak.length?'<p style="margin:8px 0 0"><b>Review first:</b> '+weak.map(function(k){ var q=chk(k), ch=findCh(q.course,q.n); return ch?'<a href="'+chHref(ch)+'">'+chLabel(q.course,q.n)+'</a>':k; }).join(', ')+'</p>':'')+
    '<div class="brk"><div class="eyebrow" style="margin:10px 0 0">By part</div>'+Object.keys(byPart).map(function(k){return row(k,byPart[k][0],byPart[k][1]);}).join('')+'<div class="eyebrow" style="margin:10px 0 0">By topic</div>'+chRows+'</div>'+
    '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="restart2">Retake with new shuffle</button><button class="btn ghost" id="wrongonly">Show only items I missed</button></div></div>';
  $('#result').scrollIntoView({behavior:'smooth',block:'start'});
  $('#submit').disabled=true;
}
function wireExam(){
  $('#scope').addEventListener('change',function(e){ ES.scope=e.target.value; ES.seed++; render(); });
  $('#mode').addEventListener('change',function(e){ ES.mode=e.target.value; render(); });
  $('#restart').addEventListener('click',function(){ ES.seed++; render(); });
  $('#submit').addEventListener('click',submitExam);
  $('#timer').addEventListener('click',function(){ if(TM){ stopTimer(); this.textContent='Start 60:00 timer'; } else if(!ES.done){ startTimer(this); } });
  var v=$('#view');
  if(!window.__examWired){ window.__examWired=true;
  v.addEventListener('change',function(e){
    var box=e.target.closest&&e.target.closest('.q'); if(!box) return;
    if(e.target.matches('input[type=radio]') && ES.mode==='practice' && box.getAttribute('data-kind')==='mcq') reveal(box);
    updateScore();
  });
  v.addEventListener('input',function(e){ if(e.target.matches('.idin')) updateScore(); });
  v.addEventListener('keydown',function(e){ if(e.key==='Enter' && e.target.matches('.idin') && ES.mode==='practice'){ reveal(e.target.closest('.q')); } });
  v.addEventListener('click',function(e){
    var t=e.target;
    if(t.matches('[data-check]')){ reveal(t.closest('.q')); }
    if(t.matches('[data-override]')){ var k=t.getAttribute('data-override'); if(ES.res[k]){ ES.res[k].got=1; var fb=t.closest('.fb'); fb.className='fb ok'; t.remove(); updateScore(); if(ES.done) submitExamRefresh(); } }
    if(t.id==='restart2'){ ES.seed++; render(); window.scrollTo(0,0); }
    if(t.id==='wrongonly'){ $$('.q').forEach(function(b){ var r=ES.res[b.getAttribute('data-key')]; b.hidden = !r || r.got>=r.max; }); $$('.part,.casebox').forEach(function(p){p.hidden=true;}); }
  });
  }
  if(ES.mode==='exam'){ $$('[data-check]').forEach(function(b){ if(b.textContent.indexOf('Check')===0) b.hidden=true; }); }
}
function submitExamRefresh(){ var d=$('#submit'); if(d){ d.disabled=false; } submitExam(); }

/* ---------- router ---------- */
var TABS = [['start','Start'],['s1','1 &middot; Insights'],['s2','2 &middot; Brand'],['s3','3 &middot; IMC'],['s4','4 &middot; CX &amp; Retail'],['s5','5 &middot; Sales'],['cheats','Cheat sheets'],['terms','Glossary'],['exam','Practice exam']];
function render(){
  stopTimer();
  var hash = (location.hash||'#start').slice(1) || 'start';
  var view = $('#view'), cur = 'start', html = '';
  var sm = hash.match(/^s([1-5])$/), cm = null;
  CORDER.forEach(function(k){ var pre=COURSES[k].pre; if(!cm && hash.indexOf(pre)===0 && /^\d+$/.test(hash.slice(pre.length))) cm=[k,+hash.slice(pre.length)]; });
  if(sm){ cur='s'+sm[1]; html=subjectView(+sm[1]); }
  else if(cm){ var s=subjOf(cm[0],cm[1]); cur=s?'s'+s.n:'start'; html=chapterView(cm[0],cm[1]); }
  else if(hash==='cheats'){ cur='cheats'; html=cheatView(); }
  else if(hash==='terms'){ cur='terms'; html=glossView(); }
  else if(hash==='exam'){ cur='exam'; html=examView(); }
  else { html=startView(); }
  view.innerHTML = html;
  $('#tabs').innerHTML = TABS.map(function(t){ return '<a href="#'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'>'+t[1]+'</a>'; }).join('');
  var curTab=$('#tabs [aria-current="page"]'); if(curTab && curTab.scrollIntoView){ try{ curTab.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(e){} }
  if(cur==='terms'){
    FC.deck=[]; var upd=function(){ $('#gbody').innerHTML=glossBody(); wireFC(); }; upd();
    $('#gq').addEventListener('input',function(){ FC.deck=[]; upd(); });
    $('#fcbtn').addEventListener('click',function(){ FC.on=!FC.on; FC.deck=[]; this.textContent=FC.on?'Back to list':'Flashcard mode'; upd(); });
    function wireFC(){ var f=$('#fcface'); if(!f) return;
      var flip=function(){ FC.back=!FC.back; upd(); };
      f.addEventListener('click',flip); f.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); }});
      $('#fcnext').addEventListener('click',function(){ FC.i++; FC.back=false; upd(); });
      $('#fcprev').addEventListener('click',function(){ FC.i=(FC.i-1+FC.deck.length)%FC.deck.length; FC.back=false; upd(); });
      $('#fcshuf').addEventListener('click',function(){ FC.deck=[]; upd(); }); }
  }
  if(cur==='exam') wireExam();
  document.title = 'RMP Exam Reviewer';
  window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-practice]');
  if(b){ ES.scope=b.getAttribute('data-practice'); ES.seed++; if(location.hash==='#exam') render(); else location.hash='#exam'; }
});
window.addEventListener('hashchange',render);
render();
})();
</script>
