<!doctype html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Brand Management Reviewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout concept: a brand-guidelines manual. Spec-sheet mono labels, highlighter-marked key terms,
   one chapter per page with a sticky index, and a scored exam that reads like a printed paper. */
:root{
  --bg:#F4F6F4; --surface:#FFFFFF; --surface2:#E9EEEB; --fg:#14201E; --muted:#55635F; --line:#D3DBD7;
  --accent:#0B6B63; --accent-ink:#FFFFFF; --accent-soft:#D9EDEA;
  --hi:#F2C230; --hi-ink:#2A2100; --hi-soft:#FFF1BE;
  --warn:#B3392B; --warn-soft:#FBE4DF; --ok:#1E7A44; --ok-soft:#DCF1E3;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#172120; --surface2:#1F2C2A; --fg:#E6EEEB; --muted:#9BAFAA; --line:#2B3B38;
  --accent:#4FC3B5; --accent-ink:#062421; --accent-soft:#17332F;
  --hi:#E5B72A; --hi-ink:#231B00; --hi-soft:#3A3115;
  --warn:#F2907F; --warn-soft:#3A201C; --ok:#6CC893; --ok-soft:#163120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#172120; --surface2:#1F2C2A; --fg:#E6EEEB; --muted:#9BAFAA; --line:#2B3B38;
  --accent:#4FC3B5; --accent-ink:#062421; --accent-soft:#17332F;
  --hi:#E5B72A; --hi-ink:#231B00; --hi-soft:#3A3115;
  --warn:#F2907F; --warn-soft:#3A201C; --ok:#6CC893; --ok-soft:#163120; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0 0 .8em}
a{color:var(--accent)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:8px}
.logo{font:700 18px/1.1 var(--f-display);white-space:nowrap}
.logo small{display:block;font:400 11px var(--f-mono);color:var(--muted);letter-spacing:.05em;margin-top:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-left:auto;max-width:100%}
.tabs a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.tabs a:hover:not([aria-current="page"]){background:var(--surface2);color:var(--fg)}
main{padding-block:26px 70px;min-height:70vh}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
mark,.k{background:var(--hi-soft);color:inherit;padding:0 3px;border-radius:3px;box-shadow:inset 0 -2px 0 var(--hi);font-weight:600}
.chip{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.hy{background:var(--hi);color:var(--hi-ink)}
.chip.core{background:var(--accent-soft);color:var(--accent)}
ul.tight{margin:.3em 0 .8em;padding-left:1.2em}
ul.tight li{margin:.2em 0}
.note-src{font-size:13px;color:var(--muted);font-style:italic}
.btn{font:600 15px var(--f-body);padding:9px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--surface2);font-family:var(--f-display);font-weight:700;font-size:14px}
.tscroll{overflow-x:auto;margin:10px 0 18px;border-radius:8px}
.tscroll table{min-width:520px}

/* start page */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start;margin-bottom:30px}
.hero h1{font-size:clamp(30px,5vw,50px);letter-spacing:-.02em}
.hero p.lead{font-size:19px;color:var(--muted);margin-top:14px;max-width:56ch}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.how li{margin:.4em 0}
.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:12px 0 30px}
.rm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rm h4{font-size:15px}
.rm .st{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.rm a.ch{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--fg);padding:6px 8px;border-radius:7px;background:var(--surface2);font-size:14px;line-height:1.3}
.rm a.ch:hover{background:var(--accent-soft)}
.rm a.ch b{font:500 12px var(--f-mono);color:var(--accent)}
.foundation{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}
.foundation .st{flex:0 0 100%}
.foundation a.ch{flex:1 1 220px}
.prio{display:grid;gap:8px}
.prio a{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-decoration:none;color:var(--fg);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prio a:hover{border-color:var(--accent)}
.prio b{font:500 13px var(--f-mono);color:var(--accent)}

/* chapters */
.split{display:grid;grid-template-columns:250px minmax(0,1fr);gap:30px;align-items:start}
.chnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow-y:auto}
.chnav a{display:grid;grid-template-columns:28px 1fr;gap:6px;text-decoration:none;color:var(--muted);padding:7px 9px;border-radius:8px;font-size:14px;line-height:1.3}
.chnav a b{font:500 12px var(--f-mono);color:var(--accent);padding-top:1px}
.chnav a:hover{background:var(--surface2);color:var(--fg)}
.chnav a[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.chhead{margin-bottom:22px}
.chhead .num{font:500 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.chhead h2{font-size:clamp(27px,4vw,38px);margin:6px 0 10px;letter-spacing:-.01em}
.chhead .why{color:var(--muted);font-size:15px;margin-top:8px}
.blk{margin:0 0 30px}
.blk>h3{font-size:21px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.blk>h3 .mono{color:var(--accent);font-weight:500}
.know{background:var(--hi-soft);border:1px solid var(--hi);border-radius:12px;padding:16px 20px}
.know h4{font:700 15px var(--f-display);margin-bottom:6px}
.know ul{margin:0;padding-left:1.15em}
.know li{margin:.25em 0}
dl.terms{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:0;margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
dl.terms dt{font-weight:700;padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:15px}
dl.terms dd{margin:0;padding:9px 14px;border-bottom:1px solid var(--line)}
dl.terms dt:last-of-type,dl.terms dd:last-of-type{border-bottom:0}
.sub{margin:0 0 20px}
.sub h4{font-size:17px;margin-bottom:6px}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ph h4{font-size:16px;margin-bottom:4px}
.ph .tag{color:var(--accent)}
.misc{border-left:0;background:var(--warn-soft);border-radius:12px;padding:14px 16px}
.misc h4{font-size:16px;margin-bottom:4px;color:var(--warn)}
.mem{background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.mem h4{font-size:16px;margin-bottom:4px}
.mem .m{font:600 16px var(--f-display);color:var(--accent)}
.take li{margin:.35em 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;flex-wrap:wrap}

/* visuals */
figure.vis{margin:16px 0 22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
figure.vis figcaption{font:700 15px var(--f-display);margin-bottom:12px}
figure.vis .cap{font-size:13px;color:var(--muted);margin-top:10px}
ol.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;counter-reset:s}
ol.flow li{flex:1 1 150px;min-width:0;background:var(--surface2);border-radius:10px;padding:10px 12px 10px 12px;position:relative;counter-increment:s}
ol.flow.num li::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 12px var(--f-mono);margin-bottom:6px}
ol.flow li b{display:block;font-family:var(--f-display);font-size:15px;line-height:1.25}
ol.flow li span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:3px}
ol.flow li .ex{color:var(--accent);font-style:italic}
@media (min-width:760px){ol.flow.arrows li:not(:last-child)::after{content:"\2192";position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:700;z-index:2;background:var(--surface);border-radius:50%;width:16px;text-align:center;line-height:16px;font-size:13px}}
.nest{display:grid;gap:0}
.nest .ly{border:2px solid var(--accent);border-radius:14px;padding:10px 12px 12px;background:var(--accent-soft)}
.nest .ly .ly{margin-top:10px;background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface))}
.nest .ly .ly .ly{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.nest .ly .ly .ly .ly{background:color-mix(in srgb,var(--accent-soft) 25%,var(--surface))}
.nest .ly .ly .ly .ly .ly{background:var(--surface)}
.nest b{font-family:var(--f-display);font-size:15px}
.nest span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4}
.pyr{display:grid;gap:8px;font-size:14px}
.pyr .row{display:grid;gap:8px}
.pyr .row.two{grid-template-columns:1fr 1fr}
.pyr .blkp{border-radius:10px;padding:9px 10px;text-align:center;color:var(--accent-ink);background:var(--accent)}
.pyr .blkp b{display:block;font:700 15px var(--f-display);letter-spacing:.02em}
.pyr .blkp span{display:block;font-size:12.5px;line-height:1.35;opacity:.95;margin-top:3px}
.pyr .l1{background:#0B6B63}.pyr .l2{background:#2A8C80}.pyr .l3{background:#4E7F9B}.pyr .l4{background:#6A5FA0}.pyr .l5{background:#8B4F8E}
.pyr .l1,.pyr .l2,.pyr .l3,.pyr .l4,.pyr .l5{color:#fff}
.pyr-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.pyr-lab{display:flex;flex-wrap:wrap;gap:6px;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;justify-content:space-between}
.mtx{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch}
.mtx .ax{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.mtx .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.mtx .cell{background:var(--surface2);border-radius:10px;padding:12px;min-height:84px}
.mtx .cell b{display:block;font-family:var(--f-display);font-size:15px}
.mtx .cell span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.mtx .cell.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.mind{display:grid;gap:12px}
.mind .c{justify-self:center;background:var(--accent);color:var(--accent-ink);font:700 16px var(--f-display);padding:10px 20px;border-radius:99px;text-align:center}
.mind .br{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.mind .b{background:var(--surface2);border-radius:10px;padding:10px 12px}
.mind .b h5{margin:0 0 6px;font:700 14px var(--f-display);color:var(--accent)}
.mind .b ul{margin:0;padding-left:1.1em;font-size:14px}
.mind .b li{margin:.15em 0}
.tree,.tree ul{list-style:none;margin:0;padding-left:20px;position:relative}
.tree{padding-left:0}
.tree li{position:relative;padding:3px 0 3px 18px}
.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
.tree li::after{content:"";position:absolute;left:0;top:17px;width:14px;border-top:2px solid var(--line)}
.tree li:last-child::before{bottom:auto;height:17px}
.tree>li{padding-left:0}.tree>li::before,.tree>li::after{display:none}
.tree .n{display:inline-block;background:var(--surface2);border-radius:8px;padding:3px 10px;font-size:14.5px}
.tree .n small{color:var(--muted);font-size:12px;margin-left:6px}
.tree .lv{font:500 10.5px var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.bars{display:grid;gap:8px}
.bars .r{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:14px}
.bars .t{display:grid;gap:3px}
.bars .bar{height:14px;border-radius:4px;background:var(--accent);display:flex;align-items:center;justify-content:flex-end;min-width:2px}
.bars .bar.b2{background:var(--line)}
.bars .bar i{font:500 10.5px var(--f-mono);font-style:normal;color:var(--accent-ink);padding-right:5px}
.bars .bar.b2 i{color:var(--fg)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.b2{background:var(--line)}
svg.venn text{font-family:var(--f-body);fill:var(--fg)}
svg.venn .t1{font-weight:700;font-size:17px}
svg.venn .t2{font-size:14px}
.stack{display:grid;gap:6px;justify-items:center}
.stack .s{border-radius:9px;padding:8px 12px;text-align:center;background:var(--accent);color:var(--accent-ink);width:var(--w)}
.stack .s b{font:700 15px var(--f-display)}
.stack .s span{display:block;font-size:13px;opacity:.92}

/* glossary */
.search{width:100%;max-width:460px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:16px var(--f-body)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
.fc{max-width:620px;margin:10px auto}
.fc .face{min-height:230px;display:grid;place-items:center;text-align:center;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:19px}
.fc .face.back{background:var(--accent-soft)}
.fc .face h3{font-size:26px}
.fc .ctl{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* exam */
.examcfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;align-items:end}
.examcfg label{display:grid;gap:5px;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.examcfg select{width:100%;min-width:0;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--f-body)}
.part{margin:34px 0 10px}
.part h3{font-size:22px}
.part p{color:var(--muted);font-size:15px;margin:4px 0 0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.q .qh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.q .qn{font:700 14px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 8px}
.q .qt{font-size:17px;margin:0 0 10px}
.q .opts{display:grid;gap:7px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;align-items:start;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ltr{font:600 12px var(--f-mono);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface2);color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:checked) .ltr{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt.wrong .ltr{background:var(--warn);color:#fff}
.fb{margin-top:12px;padding:11px 14px;border-radius:9px;font-size:15.5px;background:var(--surface2)}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--warn-soft)}
.fb b.v{font-family:var(--f-display)}
.idin{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:17px var(--f-body)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;margin:6px 0}
.mrow select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:15px var(--f-body);width:100%}
.mrow.right select{border-color:var(--ok)} .mrow.wrong select{border-color:var(--warn)}
.casebox{background:var(--hi-soft);border:1px solid var(--hi);border-radius:12px;padding:16px 18px;margin:16px 0 4px}
.casebox h4{margin-bottom:6px}
.score{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:14px 0}
.score .big{font:700 24px var(--f-display)}
.progress{flex:1 1 140px;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.result{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:20px 22px;margin:18px 0}
.result .num{font:700 48px var(--f-display);color:var(--accent);line-height:1}
.brk{display:grid;gap:6px;margin-top:12px}
.brk .r{display:grid;grid-template-columns:minmax(110px,190px) 1fr 54px;gap:10px;align-items:center;font-size:14.5px}
.brk .bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.brk .bar i{display:block;height:100%;background:var(--accent)}
.brk .bar i.low{background:var(--warn)}
.rubric label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}

@media (max-width:900px){

<script>
window.CH=[];var CH=window.CH;
CH.push({
 n:1, short:'Brands and brand management', title:'Brands and Brand Management', priority:'High-yield',
 overview:'Defines what a brand is, how it differs from a product, why brands matter to consumers and firms, what can be branded, and previews the Strategic Brand Management process that organizes the rest of the course.',
 why:'Why it ranks high: it holds the definitions and short lists (AMA definition, five product levels, six risks, benefits to consumers and firms, four SBM steps) that later chapters assume you know.',
 objectives:['State the AMA definition of a brand and explain brand versus Brand.','Describe the five levels of product meaning and where a brand adds value.','List the functions brands perform for consumers and for firms.','Explain what can be branded and why even commodities can be branded.','Outline the four steps of the Strategic Brand Management process.'],
 know:['AMA definition: a <mark>name, term, sign, symbol, or design, or a combination</mark>, that <mark>identifies</mark> and <mark>differentiates</mark>.','Five product levels in order: core benefit, generic, expected, augmented, potential.','Six risks: functional, physical, financial, social, psychological, time.','Brand equity = marketing effects <mark>uniquely attributable</mark> to the brand.','SBM steps: identify and establish positioning, plan and implement programs, measure and interpret performance, grow and sustain equity.'],
 terms:[
  ['Brand (AMA)','A name, term, sign, symbol, or design, or a combination of them, intended to identify the goods and services of one seller or group of sellers and to differentiate them from competition.'],
  ['Brand elements','The different components of a brand that identify and differentiate it (name, logo, symbol, and so on).'],
  ['brand vs Brand','Small b: the AMA identification definition. Capital B: a brand that has actually created awareness, reputation and prominence in the marketplace.'],
  ['Product','Anything we can offer to a market for attention, acquisition, use or consumption that might satisfy a need or want: a good, service, retail outlet, person, organization, place or idea.'],
  ['Core benefit level','The fundamental need or want consumers satisfy by consuming the product.'],
  ['Generic product level','A stripped-down, no-frills version with only the attributes absolutely necessary to function.'],
  ['Expected product level','The set of attributes buyers normally expect and agree to when they purchase.'],
  ['Augmented product level','Additional attributes, benefits or services that distinguish the product from competitors.'],
  ['Potential product level','All the augmentations and transformations the product might undergo in the future.'],
  ['Brand equity','The marketing effects uniquely attributable to the brand: different outcomes than if the same product did not have that name.'],
  ['Strategic brand management','Design and implementation of marketing programs and activities to build, measure and manage brand equity.']
 ],
 notes:[
  {h:'1. What is a brand?', html:'<p>The AMA definition stresses two jobs: <mark>identify</mark> the seller and <mark>differentiate</mark> from competitors. The pieces that do this are <b>brand elements</b>. Practicing managers use the word more broadly. They mean a <b>Brand</b> that has built awareness, reputation and prominence. Ultimately a brand <b>resides in the minds of consumers</b>.</p>'},
  {h:'2. Brands versus products', html:'<p>A product can be a physical good, service, retail outlet, person, organization, place or idea. A brand is <b>more than a product</b> because it carries dimensions that differentiate it from other products meeting the same need. Some brands win through <b>product performance</b>; others win through <b>non-product-related means</b> such as imagery.</p>', v:[
    {t:'nest', title:'Five levels of meaning for a product (outer layer = most added value)', layers:[['Potential product','Future augmentations and transformations'],['Augmented product','Extra attributes, benefits, services that differentiate'],['Expected product','What buyers normally expect and agree to'],['Generic product','Basic, no-frills version that merely functions'],['Core benefit','The fundamental need or want satisfied']], cap:'Read from the center out. Competition usually happens at the augmented level.'}]},
  {h:'3. Why brands matter', html:'<p>Brands do different work for each side of the exchange. Consumers also use brands to reduce six kinds of risk.</p>', tbl:{cols:['To consumers','To firms'], rows:[['Identification of the source of the product','Identification to simplify handling or tracing'],['Assignment of responsibility to the product maker','Legally protecting unique features'],['Risk reducer','Signal of quality level'],['Search cost reducer','Endowing products with unique associations'],['Promise, bond or pact with the maker','Source of competitive advantage'],['Symbolic device','Source of financial returns'],['Signal of quality','']]}, v:[
    {t:'flow', title:'Six risks brands help reduce', numbered:false, arrows:false, steps:[['Functional','Product does not perform up to expectations'],['Physical','Threat to physical well-being or health'],['Financial','Not worth the price paid'],['Social','Embarrassment from others'],['Psychological','Affects mental well-being'],['Time','Failure creates opportunity cost of finding another product']]}]},
  {h:'4. Can everything be branded?', html:'<p>Yes, as long as consumers perceive <mark>differences among brands</mark> in the category. Even commodities were branded: Maxwell House coffee, Ivory soap, Gold Medal flour, Budweiser beer, Morton salt, Quaker oatmeal, Vlasic pickles, Chiquita bananas, Perdue chickens, Dole pineapples and Perrier water. De Beers added <i>"A Diamond Is Forever"</i> to a commodity.</p><p>Things that are branded: physical goods; services; retailers and distributors; online products and services; people and organizations; sports, arts and entertainment; geographic locations; ideas and causes.</p>'},
  {h:'5. Strength, vulnerability and challenges', html:'<p>Tellis and Golder: enduring market leadership comes from <b>vision and will</b>. No brand is safe: any brand, however strong, is <b>vulnerable to poor brand management</b>. The slide lists the top ten global brands of 2006 (Coca-Cola first). Challenges: savvy customers, brand proliferation, media fragmentation, increased competition, increased costs, greater accountability.</p>', v:[
    {t:'bars', title:'Top ten global brands, brand value in $ billion (slide data)', series:['2006','2005'], rows:[['Coca-Cola',67.00,67.53],['Microsoft',56.93,59.94],['IBM',56.20,53.38],['GE',48.91,47.00],['Intel',32.32,35.59],['Nokia',30.13,26.45],['Toyota',27.94,24.84],['Disney',27.85,26.44],['McDonald\'s',27.50,26.01],['Mercedes-Benz',21.80,20.00]], cap:'Rankings are dated; memorize the idea (brands are valuable assets), not the figures.'}]},
  {h:'6. Brand equity and the SBM process', html:'<p>There is no single viewpoint on how to conceptualize or measure brand equity, but all agree it stresses the role of brand in marketing strategy. The process below organizes the course.</p>', v:[
    {t:'flow', title:'Strategic Brand Management process and its key concepts', steps:[['Identify and establish brand positioning and values','','Mental maps, competitive frame, POPs and PODs, core brand values, brand mantra'],['Plan and implement brand marketing programs','','Mix and match brand elements, integrate marketing activities, leverage secondary associations'],['Measure and interpret brand performance','','Brand value chain, brand audits, brand tracking, brand equity management system'],['Grow and sustain brand equity','','Brand-product matrix, portfolios and hierarchies, extensions, reinforcement and revitalization']]}]}
 ],
 ph:[
  ['Jollibee: brand versus product','The fried chicken, spaghetti and burgers are the <b>products</b>. The name, the bee mascot and red-and-yellow look are <b>brand elements</b>. What Filipinos feel about family celebrations at Jollibee is the capital-B <b>Brand</b> living in their minds.'],
  ['Datu Puti: branding a commodity','Vinegar and soy sauce are basic commodities. A shopper at a sari-sari store asks for a name, not a liquid. That perceived difference is what makes branding possible.'],
  ['Five levels with a 3-in-1 coffee sachet','Core: a lift of energy and comfort. Generic: instant coffee powder. Expected: pleasant taste, dissolves easily, safe, affordable sachet. Augmented: brand name, variants, promos. Potential: future formats such as ready-to-drink or health-oriented versions.'],
  ['Risk reduction when buying online','An unbranded phone charger from an unknown seller carries physical risk (overheating), functional risk (does not charge), financial risk and time risk. A known brand lowers all four.'],
  ['Place as a brand','The Department of Tourism campaign "It\'s More Fun in the Philippines" shows a geographic location branded as an experience.']
 ],
 confused:[
  ['Product versus brand','A competitor can copy a product. A brand is the set of meanings and associations in consumers\' minds that the competitor cannot copy.'],
  ['brand (small b) versus Brand (capital B)','Small b is the AMA identification definition. Capital B is a brand with real awareness, reputation and prominence.'],
  ['Generic versus expected product','Generic = bare minimum to function. Expected = what buyers assume they get. Expected is one layer up.'],
  ['Brand elements versus brand equity','Elements are the identifying parts (name, logo). Equity is the differential marketing effect the brand produces.']
 ],
 mnemonics:[
  ['Five product levels','Cats Get Eggs After Playing','Core, Generic, Expected, Augmented, Potential.'],
  ['Six risks','Few People Find Such Pain Tolerable','Functional, Physical, Financial, Social, Psychological, Time.'],
  ['Four SBM steps','I Plan My Growth','Identify, Plan, Measure, Grow.']
 ],
 takeaways:['A brand identifies and differentiates; its real home is the consumer\'s mind.','The brand adds value beyond the product at the augmented and potential levels.','Brands lower consumer risk and give firms legal protection, competitive advantage and financial returns.','Anything can be branded if consumers perceive differences.','The four-step SBM process is the backbone of the whole course.']
});

CH.push({
 n:2, short:'Customer-based brand equity', title:'Customer-Based Brand Equity', priority:'High-yield',
 overview:'Presents Keller\'s customer-based brand equity (CBBE) framework: how brand knowledge creates a differential effect, the four steps and six building blocks of the brand pyramid, and how brand equity links to CRM and customer equity.',
 why:'Why it ranks high: the CBBE pyramid is the central model of the course and the slides give long, structured lists under every block.',
 objectives:['Define customer-based brand equity and its three key ideas.','Distinguish brand awareness from brand image and recognition from recall.','Walk through the four steps, four questions and six building blocks of the CBBE pyramid.','Name the sub-dimensions of each building block.','Explain CRM and customer equity and how they relate to brand equity.'],
 know:['CBBE (Keller, 1993): the <mark>differential effect</mark> that <mark>brand knowledge</mark> has on <mark>consumer response</mark> to the marketing of that brand.','Brand knowledge = <mark>awareness + image</mark>; awareness = recognition + recall.','Pyramid bottom to top: Salience, Performance and Imagery, Judgments and Feelings, Resonance.','Questions: Who are you? What are you? What about you? What about you and me?','Customer equity = sum of lifetime values of all customers = value + brand + relationship equity.'],
 terms:[
  ['Customer-based brand equity','The differential effect that brand knowledge has on consumer response to the marketing of that brand (Keller, 1993).'],
  ['Differential effect','Differences in consumer response between the branded and the unbranded version.'],
  ['Brand knowledge','A brand node in memory with a variety of associations linked to it. Two components: brand awareness and brand image.'],
  ['Brand recognition','Consumers can confirm prior exposure to the brand when given the brand as a cue.'],
  ['Brand recall','Consumers can retrieve the brand from memory when given the product category or a related cue.'],
  ['Brand salience','Depth and breadth of brand awareness; how easily and often the brand is evoked across situations.'],
  ['Brand performance','How well the product meets customers\' functional needs.'],
  ['Brand imagery','The extrinsic properties of the product, including how it meets psychological or social needs.'],
  ['Brand judgments','Customers\' personal opinions and evaluations: quality, credibility, consideration, superiority.'],
  ['Brand feelings','Customers\' emotional reactions and responses to the brand.'],
  ['Brand resonance','The nature of the relationship and the extent to which customers feel "in sync" with the brand: intense, active loyalty.'],
  ['CRM','Using the company\'s data systems and applications to track consumer activity and manage interactions with the company.'],
  ['Customer equity','The sum of the lifetime values of all customers. Three components: value equity, brand equity, relationship equity.'],
  ['Customer lifetime value (CLV)','Affected by revenue and by the cost of customer acquisition, retention and cross-selling.']
 ],
 notes:[
  {h:'1. The core definition', html:'<p>Three phrases carry the definition. <b>Differential effect</b>: customers respond differently to the branded product. <b>Brand knowledge</b>: that difference comes from what consumers know, not from the product alone. <b>Consumer response to marketing</b>: seen in choice, ad copy recall, sales promotion response and evaluation of brand extensions. Brand equity is a <b>bridge</b>: it reflects past marketing investment and gives direction for future programs.</p>'},
  {h:'2. Sources of brand equity', html:'<p><b>Brand awareness</b> has recognition and recall. Its advantages are <mark>learning</mark> (the brand registers in minds), <mark>consideration</mark> (the brand enters the consideration set) and <mark>choice</mark> (it affects choices within the set). Build recognition through <b>repeated exposure</b>; build recall by linking the brand to the right <b>category and purchase or consumption cues</b>.</p><p><b>Brand image</b> is built from <b>strong, favorable and unique</b> associations. The source of the association does not matter, so marketers must manage and account for all sources of information, not only advertising.</p>'},
  {h:'3. Four steps, four questions, six blocks', html:'<p>Brand building runs from identity to relationships. Each step answers a question the customer silently asks.</p>', v:[
    {t:'flow', title:'The four steps of brand building', steps:[['Identity','Ensure customers identify the brand and associate it in their minds with a category or need','Who are you?'],['Meaning','Establish the totality of brand meaning','What are you?'],['Response','Elicit proper customer responses to identification and meaning','What about you?'],['Relationships','Convert response into intense, active loyalty','What about you and me?']]},
    {t:'cbbe', title:'The Customer-Based Brand Equity pyramid', cap:'Left side is the rational route (performance, judgments). Right side is the emotional route (imagery, feelings). Strong brands build both. Points-of-parity and points-of-difference sit in the middle layers.'}]},
  {h:'4. The six blocks in detail', html:'<ul class="tight"><li><b>Salience</b>: <i>depth</i> (ease of recognition and recall; clarity of category membership) and <i>breadth</i> (purchase consideration and consumption consideration). Product category structure shows why: the brand must be top-of-mind at the right times and places.</li><li><b>Performance</b> (5): primary characteristics and supplementary features; product reliability, durability, serviceability; service effectiveness, efficiency, empathy; style and design; price.</li><li><b>Imagery</b> (4): user profiles (demographic and psychographic, actual or aspirational, group perceptions); purchase and usage situations; personality and values (sincerity, excitement, competence, sophistication, ruggedness); history, heritage and experiences (nostalgia, memories).</li><li><b>Judgments</b> (4): quality (with value, satisfaction); credibility (expertise, trustworthiness, likability); consideration (relevance); superiority (differentiation).</li><li><b>Feelings</b> (6): warmth, fun, excitement, security, social approval, self-respect.</li><li><b>Resonance</b> (4): behavioral loyalty (frequency and amount of repeat purchase); attitudinal attachment (love the brand, proud of it); sense of community (kinship, affiliation); active engagement (seeks information, joins a club, visits websites and chat rooms).</li></ul>', tbl:{title:'Pyramid summary', cols:['Block','Customer question','Step','Core idea'], rows:[['Salience','Who are you?','Identity','Breadth and depth of awareness'],['Performance / Imagery','What are you?','Meaning','Functional versus psychological/social meaning'],['Judgments / Feelings','What about you?','Response','Head versus heart reactions'],['Resonance','What about you and me?','Relationships','Intense, active loyalty']]}},
  {h:'5. Brand-building implications', html:'<p>Customers own brands. Do not take shortcuts. Brands should have <b>duality</b> (rational and emotional appeal). Brands should have <b>richness</b>. Brand resonance provides important focus. The slide also shows an application: statistically identify which items under each block (P-1 to P-12, J-1 to J-12, and so on) most drive brand equity.</p>'},
  {h:'6. Creating customer value: CRM and customer equity', html:'<p>Customer-brand relationships are the foundation of resonance. Selden and Colvin\'s test of a consumer-centric company asks five questions: Is the company looking for ways to take care of you? Does it know customers well enough to differentiate between them? Is someone accountable for customers? Is it managed for shareholder value? Does it test new customer offers and learn from the results?</p><p>Blattberg and Deighton offer <b>eight guidelines</b> to maximize customer equity: invest in highest-value customers first; transform product management into customer management; use add-on sales and cross-selling; reduce acquisition costs; track customer equity gains and losses against marketing programs; relate branding to customer equity; monitor intrinsic retainability; consider separate marketing plans (even two organizations) for acquisition and retention.</p><p>Customer equity (Rust, Zeithaml and Lemon) has three components: <b>value equity, brand equity, relationship equity</b>. Customers drive the success of brands, but brands are the necessary touchpoint firms have to connect with customers. Price premiums and greater loyalty produce incremental cash flows.</p>', v:[
    {t:'flow', title:'Customer equity components', numbered:false, arrows:false, steps:[['Value equity','Objective assessment of what is received for what is given'],['Brand equity','Subjective, intangible assessment of the brand'],['Relationship equity','Tie that holds the customer to the brand beyond objective and subjective assessments']], cap:'The one-line explanations of the three components are standard textbook wording added for clarity; the slide lists only the names.'}]}
 ],
 ph:[
  ['Jollibee through the pyramid (illustrative)','Salience: first thought for fried chicken and family dining. Performance: crispy, juicy chicken, sweet-style spaghetti, speed of service. Imagery: kids\' parties, family gatherings, a Filipino identity. Judgments: good value, credible local favorite. Feelings: warmth, fun, nostalgia. Resonance: repeat visits, pride, fan communities and online engagement.'],
  ['Recognition versus recall in a sari-sari store','Seeing the Lucky Me! pack on the shelf and knowing it is familiar is recognition. Being asked "name an instant noodle brand" and answering Lucky Me! without help is recall. First to be named = top-of-mind.'],
  ['CRM in practice','A pharmacy loyalty card (such as the Mercury Drug Suki Card) records purchases, which is the data system CRM relies on to treat high-value customers differently.'],
  ['Breadth of awareness','A snack brand known only as an afternoon merienda has narrow breadth. If shoppers also think of it for school baon, gifts and road trips, its breadth is wider.']
 ],
 confused:[
  ['Brand awareness versus brand image','Awareness = can they identify and retrieve the brand (depth and breadth). Image = what associations they hold (strength, favorability, uniqueness).'],
  ['Recognition versus recall','Recognition is cued by the brand. Recall is cued by the category or need. Recall is the harder test.'],
  ['Performance versus imagery','Performance is how well the product does its functional job. Imagery is the extrinsic, psychological and social meaning.'],
  ['Judgments versus feelings','Judgments are head (opinions and evaluations). Feelings are heart (emotional reactions).'],
  ['Behavioral loyalty versus attitudinal attachment','Loyalty = repeat purchase. Attachment = loving the brand or being proud of it. Real resonance needs both, plus community and engagement.'],
  ['Brand equity versus customer equity','Brand equity = value created by the brand\'s differential effect. Customer equity = sum of lifetime values of all customers. Brand equity is one of its three components.']
 ],
 mnemonics:[
  ['Pyramid, bottom to top','Students Prefer Interesting Jokes, Funny Reels','Salience, Performance, Imagery, Judgments, Feelings, Resonance.'],
  ['Resonance (4)','BASA: Be A Super Advocate','Behavioral loyalty, Attitudinal attachment, Sense of community, Active engagement. (Basa also means "read" in Filipino.)'],
  ['Feelings (6)','We Feel Excited, Secure, Seen, Self-assured','Warmth, Fun, Excitement, Security, Social approval, Self-respect.'],
  ['Judgments (4)','Quality Customers Choose Superior','Quality, Credibility, Consideration, Superiority.'],
  ['Performance (5)','Pinoys Really Savor Sweet Pizza','Primary features, Reliability/durability/serviceability, Service, Style/design, Price.'],
  ['Imagery (4)','UPPH','User profiles, Purchase and usage situations, Personality and values, History and heritage.'],
  ['Awareness advantages','Learn, Consider, Choose','Learning, consideration and choice advantages.']
 ],
 takeaways:['CBBE = differential effect of brand knowledge on consumer response.','Brand knowledge splits into awareness (recognition, recall) and image (strong, favorable, unique associations).','The pyramid has four steps and six blocks; resonance at the top is the goal.','Build both the rational and emotional routes.','Customer equity is the sum of lifetime values, with brand equity as one component.']
});

CH.push({
 n:3, short:'Brand positioning and values', title:'Brand Positioning and Values', priority:'High-yield',
 overview:'Shows how to position a brand: choose a frame of reference, define target market and competition, establish points-of-parity and points-of-difference, resolve trade-offs, set core brand values and a brand mantra, and audit the brand.',
 why:'Why it ranks high: positioning vocabulary (POP, POD, mantra, desirability and deliverability criteria, brand audit) appears in almost every later chapter.',
 objectives:['Define brand positioning and the competitive frame of reference.','Apply the four segmentation criteria.','Differentiate points-of-parity from points-of-difference and apply the desirability and deliverability criteria.','Reconcile attribute and benefit trade-offs.','Build a brand mantra and explain internal branding.','Describe a brand audit: inventory and exploratory.'],
 know:['Positioning = designing the offer and image to occupy a <mark>distinct and valued place</mark> in the target customer\'s mind (Kotler).','Segmentation criteria: <mark>identifiability, size, accessibility, responsiveness</mark>.','POD = strongly associated, positively evaluated, not found to the same extent in competitors. POP = not unique, may be shared.','Desirability (consumer): relevant, distinctive and superior, believable. Deliverability (firm): feasible, profitable, pre-emptive/defensible.','Mantra = <mark>3 to 5 words</mark>: emotional modifier + descriptive modifier + brand function.','Brand audit = <mark>inventory</mark> (supply side) + <mark>exploratory</mark> (demand side).'],
 terms:[
  ['Brand positioning','Designing the company\'s offer and image so that it occupies a distinct and valued place in the target customer\'s mind (Kotler).'],
  ['Competitive frame of reference','Who the target consumer is, who the main competitors are, and how the brand is similar to and different from them.'],
  ['Market','The set of all actual and potential buyers who have sufficient interest in, income for and access to a product.'],
  ['Market segmentation','Dividing the market into distinct groups of homogeneous consumers with similar needs and behavior who need similar marketing mixes.'],
  ['Points-of-difference (PODs)','Attributes or benefits consumers strongly associate with a brand, evaluate positively and believe they could not find to the same extent in a competitive brand.'],
  ['Points-of-parity (POPs)','Associations not necessarily unique to the brand and possibly shared with other brands.'],
  ['Core brand values','Abstract concepts or phrases characterizing the five to ten most important dimensions of the brand\'s mental map.'],
  ['Mental map','The brand associations that make up consumers\' understanding of a brand.'],
  ['Brand mantra','Articulation of the heart and soul of the brand: a three- to five-word phrase capturing its irrefutable essence; similar to brand essence or core brand promise.'],
  ['Brand functions','The nature of the product or service or the type of experience or benefit the brand provides.'],
  ['Descriptive modifier','Further clarifies the nature of the brand.'],
  ['Emotional modifier','Qualifies how exactly the brand provides benefits and in what way.'],
  ['Internal branding','Making sure members of the organization are aligned with the brand and what it represents; crucial for service companies.'],
  ['Brand audit','A comprehensive examination of a brand to assess its health, uncover sources of equity and suggest ways to improve and leverage that equity.'],
  ['Brand inventory','A current, comprehensive profile of how all products and services sold by a company are branded and marketed (supply side).'],
  ['Brand exploratory','Research into how consumers perceive the brand: awareness, favorability, uniqueness of associations (demand side).']
 ],
 notes:[
  {h:'1. Frame of reference, target and competition', html:'<p>Positioning is at the heart of marketing strategy. Marketers need to know: who the target consumer is, who the main competitors are, how the brand is similar and how it is different. Segmentation involves trade-offs between costs and benefits. The deck\'s toothpaste example has four segments: <b>sensory</b> (flavor, appearance), <b>sociables</b> (bright teeth), <b>worriers</b> (decay prevention), <b>independent</b> (low price). Targeting a type of consumer often defines the competition, so do not define competition too narrowly: a luxury stereo may compete as much with a vacation as with furniture.</p>', v:[
    {t:'flow', title:'Four criteria for useful segments', arrows:false, steps:[['Identifiability','Can we easily identify the segment?'],['Size','Is there adequate sales potential?'],['Accessibility','Are distribution outlets and media available to reach it?'],['Responsiveness','How favorably will it respond to a tailored program?']]}]},
  {h:'2. Points-of-parity and points-of-difference', html:'<p>Two decisions drive optimal positioning: (1) define and communicate the competitive frame of reference, and (2) choose and establish POPs and PODs. The preferred approach is to tell consumers the brand\'s <b>category membership first</b>, then state the point of difference. Beyond the slides: Keller also separates category POPs, competitive POPs and correlational POPs.</p>', v:[
    {t:'venn', title:'POD and POP between your brand and a competitor', alt:'Venn diagram of points of difference and parity', a:['Your PODs','Unique, valued,','hard to match'], m:['POPs','Shared,','category entry'], b:['Rival PODs','What the other','brand owns']}],
   tbl:{title:'Choosing POPs and PODs', cols:['Desirability criteria (consumer view)','Deliverability criteria (firm view)'], rows:[['Personally relevant','Feasible'],['Distinctive and superior','Profitable'],['Believable and credible','Pre-emptive, defensible and difficult to attack']]}},
  {h:'3. Trade-offs and how to reconcile them', html:'<p>Consumers often see attributes as negatively correlated. Slide examples: price and quality, convenience and quality, taste and low calories, efficacy and mildness, power and safety, ubiquity and prestige, comprehensiveness (variety) and simplicity, strength and refinement. Three strategies to reconcile: <b>establish separate marketing programs</b>, <b>leverage secondary associations</b> (for example co-branding), or <b>redefine the relationship from negative to positive</b>.</p>'},
  {h:'4. Core brand values and the brand mantra', html:'<p>The sequence is mental map, then core brand values, then brand mantra. A mantra should <b>communicate</b> (define the category and set boundaries), <b>simplify</b> (be memorable), and <b>inspire</b> (guide what is right for the brand).</p>', v:[
    {t:'flow', title:'Brand mantra formula with the slide\'s examples', arrows:false, numbered:false, steps:[['Nike','Emotional: Authentic','Descriptive: Athletic | Function: Performance'],['Disney','Emotional: Fun','Descriptive: Family | Function: Entertainment'],['Third row (logo shown as image)','Emotional: Fun','Descriptive: Folks | Function: Food. In Keller\'s text this is McDonald\'s.']], cap:'Mantra = Emotional modifier + Descriptive modifier + Brand function.'}]},
  {h:'5. Internal branding and brand audit', html:'<p>Internal branding aligns employees with the brand and is crucial for service firms. A <b>brand audit</b> assesses the brand\'s health, uncovers sources of equity and recommends marketing programs to maximize long-term equity; it covers vision, mission, promise, values, position, personality and performance, and takes the firm and consumer perspective.</p>', v:[
    {t:'flow', title:'Brand audit flow', steps:[['Brand inventory (supply side)','Elements, supporting programs, competitors\' brands, POPs and PODs, mantra. Checks consistency and avoids redundancy and overlap.'],['Brand exploratory (demand side)','Consumer research on awareness, favorability and uniqueness; identifies sources of customer-based equity and knowledge structures.'],['Recommendations','SWOT, brand equity evaluation, strategic brand management recommendations']]}],
   tbl:{title:'Suggested audit outline from the slides', cols:['Part','Contents'], rows:[['Objectives and scope','Audit objectives, scope, approach'],['Background','Self-analysis of the brand; industry background; consumer analysis (trends, motivation, perceptions, needs, segmentation, behavior)'],['Brand inventory','Elements, current programs, POPs and PODs, branding strategies, portfolio analysis, competitors\' inventory, strengths and weaknesses'],['Brand exploratory','Brand associations, positioning analysis, perceptions versus competition, competitor summary, SWOT, equity evaluation, recommendations']]}}
 ],
 ph:[

  ['A draft mantra (illustrative, not official)','"Joyful Filipino family food": emotional modifier = Joyful, descriptive modifier = Filipino family, function = food. It is short, communicates the category, and inspires staff.'],

 know:['Six criteria: <mark>memorability, meaningfulness, likability, transferability, adaptability, protectability</mark>.','First three build equity (offensive). Last three leverage and maintain it (defensive).','Naming steps: define objectives, generate, screen, study, research, select.','Three ways to deal with a URL owned by someone else: sue, buy, or pre-register variations.','Packaging objectives: identify, convey information, ease transport and protection, home storage, aid consumption.'],

 notes:[
  {h:'1. Where brand knowledge comes from', html:'<p>Brand knowledge structures depend on three things: the <b>initial choice of brand elements</b>, the supporting <b>marketing program</b>, and <b>secondary associations</b> transferred by linking the brand to other entities (Chapter 7).</p>'},

  {h:'3. Brand names', html:'<p>Apply the six criteria. Brand awareness guidelines: <b>simplicity</b> and ease of pronunciation and spelling; <b>familiarity</b> and meaningfulness; <b>differentiated, distinctive, unique</b>. For associations, the implicit and explicit meanings must reinforce the positioning. Meaningfulness dimension 1 (category) drives awareness and salience; dimension 2 (attributes and benefits) drives image and positioning.</p>', v:[

  {h:'4. URLs, logos, characters, slogans, jingles', html:'<ul class="tight"><li><b>URLs</b>: if another party holds your name you can sue (for infringement), buy it, or register all conceivable variations ahead of time.</li><li><b>Logos and symbols</b>: play a critical role in awareness; range from word marks to abstract designs.</li><li><b>Characters</b>: animated (Poppin\' Fresh Doughboy, Tony the Tiger, Cap\'n Crunch, Snap Crackle &amp; Pop) or live action (Juan Valdez, Maytag repairman, Ronald McDonald).</li><li><b>Slogans</b>: efficient shorthand to build equity, e.g. "Melts in your mouth, not in your hands" (M&amp;M\'s), "Where\'s the beef?" (Wendy\'s), "Can you hear me now?" (Verizon).</li><li><b>Jingles</b>: catchy hooks that lodge in memory; most valuable for awareness.</li></ul>'},
  {h:'5. Packaging', html:'<p>Objectives: identify the brand; convey descriptive and persuasive information; facilitate transportation and protection; assist at-home storage; aid consumption. Packaging also affects behavior:</p><ul class="tight"><li><b>Taste</b>: what we see on a package can make us taste what we expect.</li><li><b>Value</b>: long after purchase, packaging can lead us to believe we bought for good value.</li><li><b>Consumption</b>: across 48 food and personal-care products, people pour and consume <mark>18% to 32% more</mark> as container size doubles.</li><li><b>Use</b>: for mature products, new uses (soup for breakfast; baking soda as a refrigerator deodorizer). In a study of 26 products and 402 consumers, <mark>twice as many</mark> learned of the new use from the package as from TV ads.</li></ul>'},
  {h:'6. Putting it together', html:'<p>The full set of elements is the <b>brand identity</b>. The more consistent the elements are with one another, the more cohesive the identity. Complementarity (different elements covering each other\'s weaknesses) is picked up again in Chapter 15.</p>'}

  ['Mascot as a memorable element','The Jollibee bee is a character: easy to recall, likable to kids, adaptable through new looks and seasonal costumes, and transferable across the restaurant, retail and delivery lines.'],
  ['A name with meaning','"Mang Inasal" tells you the category (grilled chicken, Filipino style) through the name alone. That is high meaningfulness at the category level, which helps salience.'],
  ['Protectability in the Philippines','Beyond the slides: trademarks are registered with the Intellectual Property Office of the Philippines (IPOPHL) under the IP Code (Republic Act 8293). Register early and police infringement.'],
  ['Slogans and jingles','Local examples are "Langhap-sarap" (Jollibee) and "Sarap to the bones" (Max\'s). Short, rhythmic Filipino phrases are easy to remember and travel well across TV, radio and social media.'],
  ['Packaging influences use','Sachets drive trial and affordability; a bigger bottle can raise how much people pour. Back-of-pack recipes teach new uses at the point of consumption.']

  ['Logo versus symbol versus character','Logo = distinctive word mark or abstract design. A character is a symbol with human or real-life traits.'],
  ['Slogan versus jingle','Slogan is a short phrase. Jingle is a musical message around the brand.'],
  ['Brand identity versus brand image','Identity = the set of brand elements the firm chooses. Image = associations held in consumers\' minds.']

  {h:'1. New perspectives on marketing', html:'<p>Four shifts changed the strategy and tactics behind marketing programs: <b>digitalization and connectivity</b> (Internet, intranet, mobile), <b>disintermediation and reintermediation</b> (new middlemen), <b>customization and customerization</b> (customers help make or tailor products), and <b>industry convergence</b> (blurred boundaries). Marketers are abandoning the mass-market strategies that built powerhouse brands in the 1950s to 1970s and trying unconventional ways to break through noise.</p>'},
  {h:'2. Personalizing marketing', html:'<p>Relationship marketing is a powerful brand-building force: it can slip through consumer radar, create unique associations and reinforce imagery and feelings. Traditional marketing is still needed for control and predictability.</p>', tbl:{cols:['Approach','Key idea','Details from the slides'], rows:[['Experiential','Customer experience','Focus on the consumption situation; customers are rational and emotional; eclectic methods'],['One-to-one','Treat customers differently','Consumers add value by providing information; firm adds value through rewarding experiences; creates switching costs, reduces transaction costs, maximizes utility'],['Permission','Earn the right to message','Anticipated, personal, relevant; opposite of interruption marketing']]}, v:[

  ['One-to-one and loyalty programs','Pharmacy or supermarket loyalty cards (for example Suki Card, SM Advantage Card) identify customers individually, track value, and let the firm customize offers, which is the one-to-one logic.'],
  ['Permission versus interruption','A shopper who opts in to a retailer\'s app or SMS alerts for deals they selected has granted permission. A TV commercial in the middle of a teleserye is interruption.'],

  {h:'3. Brand equity measurement system', html:'<p>Three parts: conducting brand audits (Chapter 3), developing tracking procedures, and designing a brand equity management system. <b>Tracking</b> should be customized: product-brand tracking, corporate or family brand tracking, global tracking. Decide who to track (target market), when and where (frequency) and how to interpret results.</p>'},

  {h:'1. Qualitative techniques', html:'<ul class="tight"><li><b>Free association</b> (e.g., Levi\'s 501: attributes, benefits, user imagery, usage imagery, personality; functional, symbolic and experiential benefits).</li><li><b>Projective techniques</b>: completion and interpretation tasks; comparison tasks. Used because it may seem socially unacceptable to express true feelings.</li><li><b>ZMET</b>: guided conversation with steps that can include story telling, missed images, sorting task, construct elicitation, most representative picture, opposite images, sensory images, mental map, summary image, vignette.</li><li><b>Brand personality</b> and values, with Aaker\'s five dimensions.</li><li><b>Experiential methods</b>: researchers visit homes, give business travelers cameras and diaries, run "beeper studies".</li></ul>', v:[
    {t:'flow', title:'Aaker\'s brand personality dimensions (1997)', numbered:false, arrows:false, steps:[['Sincerity','Down-to-earth, wholesome, cheerful'],['Excitement','Daring, spirited, imaginative, up-to-date'],['Competence','Reliable, intelligent, successful'],['Sophistication','Upper class, charming'],['Ruggedness','Outdoorsy, tough']]}]},

  {h:'4. Young &amp; Rubicam Brand Asset Valuator', html:'<p>BAV scale: 240,000+ consumers, up to 181 categories, 137 studies, 40 countries, 8 years, 56 brand metrics, common methodology. Five pillars: differentiation (basis of choice, source of margin), energy, relevance (usage, relates to sale), esteem (respect, regard), knowledge (the culmination of brand-building efforts).</p>', tbl:{title:'Reading the pillars (slide diagnostics)', cols:['Pattern','Meaning','Slide examples'], rows:[['Differentiation &gt; Relevance','Healthy: room to grow; brand has power to build relevance','Harley-Davidson, Yahoo!, AOL, Williams-Sonoma, Ikea, Bloomberg'],['Relevance &gt; Differentiation','Danger of becoming a commodity; price becomes the main reason to buy','Exxon, Mott\'s, McDonald\'s, Crest, Minute Maid'],['Esteem &gt; Knowledge','Better liked than known: "I\'d like to get to know you better"','Coach, Tag Heuer, Calphalon, Movado'],['Knowledge &gt; Esteem','Better known than liked: "I know you and you\'re nothing special"','Plymouth, TV Guide, Spam, Woolworths, Chrysler, Maxwell House']]}, v:[

  ['Free association with Filipino consumers','Ask: What do you like best about Jollibee? What do you dislike? What is unique compared with other fast-food brands? The answers surface attributes, benefits and attitudes.'],

  ['Unaided versus aided recall','Unaided: "Name a coffee brand." Aided: "Which of these have you heard of?" followed by a list. Aided scores are always higher; the gap shows how much a cue helps retrieval.'],

  {h:'3. Holistic methods', html:'<p><b>Residual</b>: subtract preferences based on physical attributes alone from overall brand preferences. Advantage: useful benchmark, especially financially. Disadvantage: static view; limited diagnostic value for strategy. <b>Valuation</b>: put a financial value on equity.</p>'},

  {h:'1. Role of brand architecture and the brand-product matrix', html:'<p>Architecture does two jobs. <b>Clarify</b> (brand awareness): improve consumer understanding and communicate similarities and differences between products. <b>Motivate</b> (brand image): maximize transfer of equity to and from the brand to individual products to improve trial and repeat purchase.</p><p>The matrix: <b>rows</b> are brand-product relationships (line and category extensions); <b>columns</b> are product-brand relationships (the brand portfolio).</p>', tbl:{title:'Brand-product matrix (schematic)', cols:['Brands &#92; Products','Product 1','Product 2','Product 3','Product 4'], rows:[['Brand A','A1','A2','A3','A4'],['Brand B','B1','B2','',''],['Brand C','','','C3','C4']]}},
  {h:'2. Breadth and depth', html:'<p><b>Breadth</b> of the product mix is shaped by aggregate market factors, category factors and environmental factors; <b>depth</b> of the product mix looks at sales and profit contribution of each item and the length of the line (longer lines expand coverage and share but raise costs). The <b>depth of a branding strategy</b> is the brand portfolio: different brands for different segments, channels or geographies, to maximize coverage and minimize overlap. The slide\'s example is the Ford portfolio (Ford, Mercury, Mazda, Volvo, Lincoln, Jaguar, Land Rover).</p>', v:[
    {t:'flow', title:'Roles of brands in a portfolio', numbered:false, arrows:false, steps:[['Flankers','Protect the flagship'],['Cash cows','Harvest profit'],['Low-end entry-level','Draw customers in'],['High-end prestige','Add credibility and image']]}]},
  {h:'3. Brand hierarchy', html:'<p>A hierarchy lays out brand elements from top to bottom. Decisions: how many levels, how elements from different levels combine for one product, how one element links to multiple products, and the desired awareness and image at each level. Corporate image dimensions include product attributes (quality, innovativeness), people and relationships (customer orientation), values and programs (concern with the environment, social responsibility) and corporate credibility (expertise, trustworthiness, likability).</p>', v:[
    {t:'tree', title:'Toyota hierarchy (from the slide, simplified)', root:{t:'Toyota Corporation',lv:'Corporate',k:[{t:'Toyota (cars)',lv:'Family',k:[{t:'Corolla',lv:'Individual',k:[{t:'CE / LE / S',lv:'Modifier'}]},{t:'Camry',lv:'Individual',k:[{t:'LE / SE / XLE',lv:'Modifier'}]},{t:'Prius',lv:'Individual'}]},{t:'Toyota (trucks)',lv:'Family'},{t:'Toyota (SUV / vans)',lv:'Family'},{t:'Lexus',lv:'Family'},{t:'Toyota Financial Services',lv:'Family'}]}},
    {t:'tree', title:'The slide\'s General Motors example of the four levels', root:{t:'General Motors',lv:'Corporate',k:[{t:'Buick',lv:'Family',k:[{t:'Park Avenue',lv:'Individual',k:[{t:'Ultra',lv:'Modifier'}]}]}]}}]},
  {h:'4. Six hierarchy principles', html:'', v:[
    {t:'flow', title:'Brand hierarchy principles', numbered:false, arrows:false, steps:[['Simplicity','Use as few levels as possible'],['Clarity','Logic and relationship among elements must be obvious'],['Relevance','Create global associations relevant across as many items as possible'],['Differentiation','Differentiate individual items and brands'],['Prominence','Relative prominence of elements affects perceived product distance and image'],['Commonality','More shared elements, stronger linkages']]}]},
  {h:'5. Brand architecture guidelines', html:'<p>Adopt a strong customer focus; avoid over-branding; establish rules and conventions and be disciplined; create broad, robust brand platforms; selectively employ sub-brands to complement and strengthen brands; selectively extend brands to build new equity and enhance existing equity.</p>'},
  {h:'6. Corporate campaigns, cause marketing and crises', html:'<p><b>Corporate brand campaign objectives</b>: build awareness of the company and its business; create favorable attitudes and credibility; link beliefs that product marketing can leverage; impress the financial community; motivate employees and attract recruits; influence public opinion on issues.</p><p><b>Cause marketing advantages</b>: awareness, image, credibility, feelings, community, engagement. <b>Green marketing</b> is a special case concerned with the environment. <b>Crisis marketing</b>: respond swiftly and sincerely.</p>'}
 ],
 ph:[
  ['Jollibee Foods Corporation as a portfolio','Jollibee, Chowking, Greenwich, Red Ribbon and Mang Inasal serve different segments and occasions (chicken and burgers, Chinese-style fast food, pizza and pasta, bakeshop, grilled chicken). That is a portfolio designed to maximize coverage and minimize overlap.'],
  ['A four-level hierarchy in a pantry','Monde Nissin (corporate) &rarr; Lucky Me! (family) &rarr; Pancit Canton (individual) &rarr; a flavor such as Chilimansi (modifier). The modifier tells shoppers how products under the same name differ.'],

 ],

  {h:'5. How customers evaluate extensions', html:'<p>Managerial assumptions: consumers have some awareness and positive associations about the brand; at least some positive associations are evoked by the extension; negative associations are not transferred from the parent; and negative associations are not created by the extension.</p><p><b>Creating extension equity</b> depends on salience of parent associations in the extension context, favorability of inferred associations, and uniqueness of inferred associations.</p><p><b>Contributing to parent brand equity</b> depends on how compelling the extension evidence is, how relevant or diagnostic it is for the parent, how consistent it is with parent associations, and how strongly the parent\'s associations are held.</p>'},
  {h:'6. Success factors and evaluation process', html:'<p>Successful extensions create POPs and PODs in the new category, recognize competitive reactions, enhance the parent\'s POPs and PODs, and maximize advantages while minimizing disadvantages. Extensions work when consumers see some basis of <b>fit</b> or similarity. Slide successes: Ivory shampoo, Vaseline Intensive Care lotion, Hershey chocolate milk, Jell-O pudding pops, Visa traveler\'s checks, Sunkist orange soda, Colgate toothbrushes, Mars ice cream bars, Arm &amp; Hammer toothpaste, Bic lighters, Aunt Jemima syrup, Honda lawn mowers. Slide failures: Campbell\'s tomato sauce, LifeSavers gum, Cracker Jack cereal, Harley-Davidson wine coolers, Hidden Valley frozen entrees, Bic perfume, Ben-Gay aspirin, Kleenex diapers, Levi\'s Tailored Classics suits, Nautilus shoes, Domino\'s bubble gum, Smucker\'s ketchup, Fruit of the Loom detergent.</p>', v:[

 ],

CH.push({

 terms:[

 ],
 notes:[
  {h:'1. Long-term view', html:'<p>Any marketing action can change consumer knowledge. Those changes also affect how consumers respond to future marketing. Past responses shape awareness and image, which shape current responses, which shape future responses.</p>', v:[
    {t:'flow', title:'The chain of brand knowledge over time', steps:[['Consumer response to past marketing'],['Brand awareness and brand image'],['Consumer response to current marketing'],['Changed brand awareness and image'],['Consumer response to future marketing']]}]},
  {h:'2. Reinforcing brands', html:'<p>Tools: maintain <b>consistency</b> (in the amount and nature of marketing support); <b>protect sources of equity</b> (keep the brand relevant; innovate in product design, manufacturing, merchandising; continuity in meaning with changes in tactics); manage the <b>trade-off between fortifying and leveraging</b>; <b>fine-tune</b> the supporting program. Guiding questions: What products does the brand represent? What benefits? What needs? How does the brand make products superior? What strong, favorable, unique associations exist?</p>'},
  {h:'3. Revitalizing brands', html:'<p>Two objectives: expand the depth and breadth of awareness; improve the strength, favorability and uniqueness of associations (existing or new).</p>', v:[
    {t:'mind', title:'Revitalization strategy map', center:'Revitalizing a brand', branches:[

      ['Improve image',['Refresh old sources of equity','Create new sources of equity','Bolster fading associations; neutralize negative ones','Create new associations']],
      ['Customers',['Retain vulnerable customers','Recapture lost customers','Identify neglected segments','Attract new customers']]]}],
   html2:''},
  {h:'4. Image and market strategies', html:'<p><b>Repositioning</b> may establish more compelling PODs; sometimes the key POD is nostalgia and heritage rather than a product difference; other times a missing POP must be established. <b>Changing brand elements</b> signals new meaning. <b>Back to basics</b> (product, pricing, channel, communication) taps existing equity (Harley-Davidson). <b>Create new sources</b> (Mountain Dew). <b>Entering new markets</b>: abandon the old supporting segment and target a new one.</p><p>Increasing usage: communicate appropriateness of more frequent use in current situations, send reminders, and find new uses.</p>'},
  {h:'5. Adjustments to the brand portfolio', html:'<p><b>Migration strategies</b>: a logically ordered hierarchy helps customers move up (BMW 3-, 5-, 7-series). <b>Acquiring new customers</b>: balance spend on new versus existing customers; proactively attract younger customers. <b>Retiring brands</b>.</p>'}
 ],
 ph:[
  ['Increasing frequency','A brand of instant noodles positioned only as a rainy-day meal could promote it as merienda or study-night food to raise frequency (illustrative).'],
  ['New uses','Back-of-pack recipes that show a canned meat product in breakfast sandwiches or fried rice find new uses without changing the product.'],
  ['Heritage as a POD','A decades-old local biscuit or soft drink can lean on nostalgia and \"lola\'s pantry\" memories to differentiate from newer rivals.'],
  ['Migration','A mobile operator tries to move prepaid users to postpaid plans as incomes rise; a ladder of tiers makes the step feel natural.']
 ],
 confused:[

  ['Fortifying versus leveraging','Fortifying = invest in the brand. Leveraging = harvest/use its equity.'],

 n:14, short:'Geographic boundaries and segments', title:'Managing Brands Over Geographic Boundaries and Market Segments', priority:'Core',
 overview:'Covers regional and demographic segments and the international arena: why firms go global, pros and cons of global marketing programs, standardization versus customization, and the Ten Commandments of global branding.',
 why:'Why it is Core: balanced pro and con lists, Levitt\'s thesis and the commandments are easy to turn into questions.',

  {h:'1. Regional and demographic segments', html:'<p>Reasons for regional marketing: need for more focused targeting; shift from national advertising to sales promotions. Drawbacks: production headaches, lower marketing efficiency and higher costs. Other segments: age groups (bringing younger consumers into the franchise) and ethnic segments (slide: Asians and Hispanics were 79 million of 281 million people in the US, about $1 trillion of annual purchasing power).</p>'},
  {h:'2. Rationale and trade-offs of global marketing', html:'', tbl:{cols:['Rationale for going international','Advantages of global programs','Disadvantages of global programs'], rows:[['Slow growth and more competition at home','Economies of scale in production and distribution','Differences in consumer needs, wants and usage patterns'],['Belief in overseas growth and profit','Lower marketing costs','Differences in brand and product development and competitive environment'],['Desire for economies of scale','Power and scope','Differences in the legal environment'],['Need to diversify risk','Consistency in brand image','Differences in marketing institutions'],['Global mobility of customers','Ability to leverage good ideas quickly','Differences in administrative procedures'],['','Uniformity of marketing practices','']]}},
  {h:'3. Standardization versus customization', html:'<p>Levitt argued the world is shrinking, so well-managed companies should offer globally standardized, advanced, functional, reliable and low-priced products. In practice firms blend global objectives with local concerns: <b>"Think global. Act local."</b> A global brand keeps the same positioning and benefits and tailors when needed.</p>', v:[
    {t:'flow', title:'The standardization-customization spectrum', arrows:true, numbered:false, steps:[['Fully standardized','Same product, positioning, program everywhere (Levitt)'],['Think global, act local','Same core equity; adapt elements, program or secondary associations as needed'],['Fully customized','Different brand and program in each market']]}]},
  {h:'4. Building a global brand', html:'<p>Identify differences in consumer behavior (how they buy and use products; what they know and feel about brands), then adjust the program: choice of brand elements, nature of the supporting program, leverage of secondary associations. Questions to ask: How valid is the mental map in the new market? What is the level of awareness? How valuable are the associations? What changes are needed? How should the new map be created?</p><p>Global CBBE needs breadth and depth of awareness, POPs and PODs, positive accessible responses and intense active relationships. The six building blocks are salience, performance, imagery, responses (judgments), feelings and resonance.</p>'},
  {h:'5. Ten commandments of global branding', html:'<ol class="tight"><li>Understand similarities and differences in the global branding landscape.</li><li>Do not take shortcuts in brand building.</li><li>Establish marketing infrastructure.</li><li>Embrace integrated marketing communications.</li><li>Cultivate brand partnerships.</li><li>Balance standardization and customization.</li><li>Balance global and local control.</li><li>Define operable guidelines.</li><li>Implement a global brand equity measurement system.</li><li>Leverage brand elements.</li></ol>'}
 ],

  ['Regional segments','Brands use Cebuano, Ilocano or Tagalog messages, regional flavors and local festivals. Inasal grilled chicken has Western Visayas roots, which is why local authenticity can be a regional POD.'],

  {h:'1. Summary of the framework', html:'<p>Brand knowledge structure = brand awareness (depth and breadth) plus brand associations. Sources of equity: strength, favorability and uniqueness. Outcomes: greater loyalty; less vulnerability to competitive actions and crises; larger margins; more inelastic response to price increases and more elastic response to price decreases; greater trade cooperation; more effective communications; licensing opportunities; extension opportunities.</p>'},
  {h:'2. Tactical guidelines', html:'<p>Build equity through (1) the initial choice of brand elements, (2) marketing activities and program design, (3) leveraging secondary associations. <b>Building</b>: mix and match elements; create a rich image and high perceived quality; value-based pricing; a range of distribution options; mix communication options; leverage secondary associations. <b>Measuring</b>: formalize the firm\'s view; conduct inventories; conduct tracking; assemble outcome measures; establish a department to oversee. <b>Managing</b>: define hierarchy; create global associations; introduce extensions; set portfolio roles; reinforce and enhance equity over time; identify consumer differences across segments.</p>'},

EX.essay = [
 {ch:[2], q:'Explain the Customer-Based Brand Equity pyramid. Apply it to a brand you know well (for example a fast-food, telecom or beverage brand).', model:'<p>The CBBE pyramid has <b>four steps</b> that answer four customer questions, built from <b>six blocks</b>. Step 1, <b>identity</b> (Who are you?): <b>salience</b>, the depth and breadth of awareness. Step 2, <b>meaning</b> (What are you?): <b>performance</b> (functional) and <b>imagery</b> (extrinsic, psychological and social). Step 3, <b>response</b> (What about you?): <b>judgments</b> (head: quality, credibility, consideration, superiority) and <b>feelings</b> (heart: warmth, fun, excitement, security, social approval, self-respect). Step 4, <b>relationships</b> (What about you and me?): <b>resonance</b> (loyalty, attachment, community, engagement). Strong brands build the rational and emotional routes. In the application, give one concrete example for each block.</p>', rubric:['Names all four steps and the four questions','Names all six blocks in the correct order','Gives sub-dimensions for at least three blocks','Distinguishes the rational route from the emotional route','Applies each block to a real brand with an example','Explains why resonance is the goal']},

 {ch:[8,10], q:'Explain the brand value chain and compare two approaches to measuring the value of a brand.', model:'<p>The <b>brand value chain</b> traces how marketing creates value through four stages: <b>marketing program investment</b>, <b>customer mindset</b> (awareness, associations, attitudes, attachment, activity), <b>market performance</b> (price premiums, elasticity, share, expansion success, cost structure, profitability) and <b>shareholder value</b> (stock price, P/E, market cap). Three multipliers determine how much value moves between stages: <b>program quality</b> (clear, relevant, distinctive, consistent), <b>customer</b> (competitive superiority, channel support, customer size and profile) and <b>market</b> (market dynamics, growth potential, risk profile, brand contribution). To compare two measurement approaches, use for example <b>brand-based comparative</b> (blind testing: isolates brand value but limited to the applications examined) and <b>Interbrand valuation</b> (NPV of forecast brand earnings: gives a financial value useful for M&amp;A but needs many assumptions), or <b>marketing-based</b> and <b>conjoint</b>.</p>', rubric:['Names the four value stages in order','Names the three multipliers','Gives at least two items under customer mindset or market performance','Describes two measurement approaches','States an advantage and a disadvantage for each approach','Links measurement to accountability (ROMI)']}
