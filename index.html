<script>
(function(){
'use strict';
var CH = window.CH || [], EX = window.EX || {};
var $ = function(s, el){ return (el||document).querySelector(s); };
var $$ = function(s, el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function strip(s){ return String(s).replace(/<[^>]+>/g,''); }
function pad(n){ return n<10 ? '0'+n : ''+n; }

/* ---------- visuals ---------- */
var V = {
  flow: function(v){
    return '<ol class="flow '+(v.numbered===false?'':'num ')+(v.arrows===false?'':'arrows')+'">'+v.steps.map(function(s){
      return '<li><b>'+s[0]+'</b>'+(s[1]?'<span>'+s[1]+'</span>':'')+(s[2]?'<span class="ex">'+s[2]+'</span>':'')+'</li>';
    }).join('')+'</ol>';
  },
  nest: function(v){
    function lay(i){ if(i>=v.layers.length) return ''; var l=v.layers[i];
      return '<div class="ly"><b>'+l[0]+'</b>'+(l[1]?'<span>'+l[1]+'</span>':'')+lay(i+1)+'</div>'; }
    return '<div class="nest">'+lay(0)+'</div>';
  },
  matrix: function(v){
    var c=v.cells;
    function cell(x,i){ return '<div class="cell'+(v.on&&v.on.indexOf(i)>-1?' on':'')+'"><b>'+x[0]+'</b>'+(x[1]?'<span>'+x[1]+'</span>':'')+'</div>'; }
    return '<div class="mtx"><div></div><div class="ax">'+v.cols[0]+'</div><div class="ax">'+v.cols[1]+'</div>'+
      '<div class="ax v">'+v.rows[0]+'</div>'+cell(c[0],0)+cell(c[1],1)+
      '<div class="ax v">'+v.rows[1]+'</div>'+cell(c[2],2)+cell(c[3],3)+'</div>'+
      (v.axisNote?'<div class="cap">'+v.axisNote+'</div>':'');
  },
  mind: function(v){
    return '<div class="mind"><div class="c">'+v.center+'</div><div class="br">'+v.branches.map(function(b){
      return '<div class="b"><h5>'+b[0]+'</h5><ul>'+b[1].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>'; }).join('')+'</div></div>';
  },
  tree: function(v){
    function node(n){ return '<li><span class="n">'+(n.lv?'<span class="lv">'+n.lv+'</span>':'')+n.t+(n.s?'<small>'+n.s+'</small>':'')+'</span>'+
      (n.k&&n.k.length?'<ul>'+n.k.map(node).join('')+'</ul>':'')+'</li>'; }
    return '<ul class="tree">'+node(v.root)+'</ul>';
  },
  bars: function(v){
    var max=0; v.rows.forEach(function(r){ r.slice(1).forEach(function(x){ if(x>max) max=x; }); });
    return '<div class="legend"><span><i></i>'+v.series[0]+'</span>'+(v.series[1]?'<span><i class="b2"></i>'+v.series[1]+'</span>':'')+'</div><div class="bars">'+v.rows.map(function(r){
      return '<div class="r"><span>'+r[0]+'</span><div class="t">'+r.slice(1).map(function(x,i){
        return '<div class="bar'+(i?' b2':'')+'" style="width:'+(x/max*100).toFixed(1)+'%"><i>'+x.toFixed(1)+'</i></div>'; }).join('')+'</div></div>'; }).join('')+'</div>';
  },
  venn: function(v){
    function tx(x,arr){ return '<text x="'+x+'" y="128" text-anchor="middle" class="t1">'+arr[0]+'</text><text x="'+x+'" y="152" text-anchor="middle" class="t2">'+arr[1]+'</text><text x="'+x+'" y="174" text-anchor="middle" class="t2">'+(arr[2]||'')+'</text>'; }
    return '<svg class="venn" viewBox="0 0 640 300" role="img" aria-label="'+esc(v.alt||'Venn diagram')+'" style="width:100%;height:auto;max-width:640px;display:block;margin:0 auto">'+
      '<circle cx="240" cy="150" r="130" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2"/>'+
      '<circle cx="400" cy="150" r="130" fill="var(--hi)" fill-opacity=".28" stroke="var(--hi)" stroke-width="2"/>'+
      tx(190,v.a)+tx(320,v.m)+tx(450,v.b)+'</svg>';
  },
  stack: function(v){
    var n=v.items.length;
    return '<div class="stack">'+v.items.map(function(s,i){ var w=v.invert? (100-(i*(60/(n-1)))) : (40+(i*(60/(n-1))));
      return '<div class="s" style="--w:'+w.toFixed(0)+'%"><b>'+s[0]+'</b>'+(s[1]?'<span>'+s[1]+'</span>':'')+'</div>'; }).join('')+'</div>';
  },
  cbbe: function(){
    function b(l,t,s){ return '<div class="blkp '+l+'"><b>'+t+'</b><span>'+s+'</span></div>'; }
    return '<div class="pyr-wrap"><div class="pyr-lab"><span>Rational route (head) &larr;</span><span>&rarr; Emotional route (heart)</span></div><div class="pyr">'+
      '<div class="row">'+b('l5','4 &middot; RESONANCE','Loyalty &middot; Attachment &middot; Community &middot; Engagement')+'</div>'+
      '<div class="row two">'+b('l4','3 &middot; JUDGMENTS','Quality &middot; Credibility &middot; Consideration &middot; Superiority')+b('l4','3 &middot; FEELINGS','Warmth &middot; Fun &middot; Excitement &middot; Security &middot; Social approval &middot; Self-respect')+'</div>'+
      '<div class="row two">'+b('l3','2 &middot; PERFORMANCE','Features &middot; Reliability &middot; Service &middot; Style/design &middot; Price')+b('l3','2 &middot; IMAGERY','User profiles &middot; Purchase/usage situations &middot; Personality/values &middot; History/heritage')+'</div>'+
      '<div class="row">'+b('l1','1 &middot; SALIENCE','Depth and breadth of awareness &middot; category identification &middot; needs satisfied')+'</div></div>'+
      '<div class="pyr-lab"><span>Step 1 Identity: Who are you?</span><span>Step 2 Meaning: What are you?</span><span>Step 3 Response: What about you?</span><span>Step 4 Relationships: What about you and me?</span></div></div>';
  }
};
function vis(v){
  return '<figure class="vis"><figcaption>'+v.title+'</figcaption>'+V[v.t](v)+(v.cap?'<div class="cap">'+v.cap+'</div>':'')+'</figure>';
}

/* ---------- chapter page ---------- */
function prioChip(p){ return p==='High-yield' ? '<span class="chip hy">High-yield</span>' : (p==='Core' ? '<span class="chip core">Core</span>' : '<span class="chip">Support</span>'); }
function table(t){
  return '<div class="tscroll"><table>'+(t.title?'<caption class="eyebrow" style="text-align:left;caption-side:top;padding-bottom:6px">'+t.title+'</caption>':'')+
    '<thead><tr>'+t.cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'+
    t.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
}
function chapterView(n){
  var c = CH.filter(function(x){return x.n===n;})[0]; if(!c) return '<p>Chapter not found.</p>';
  var prev = CH.filter(function(x){return x.n===n-1;})[0], next = CH.filter(function(x){return x.n===n+1;})[0];
  var nav = '<nav class="chnav" aria-label="Chapters">'+CH.map(function(x){
    return '<a href="#ch-'+x.n+'"'+(x.n===n?' aria-current="page"':'')+'><b>'+pad(x.n)+'</b><span>'+x.short+'</span></a>'; }).join('')+'</nav>';
  var h = '<article>'+
    '<header class="chhead"><div class="num">Chapter '+c.n+' &middot; '+prioChip(c.priority)+'</div><h2>'+c.title+'</h2><p>'+c.overview+'</p><p class="why">'+c.why+'</p></header>';
  h += '<section class="blk"><div class="grid2"><div class="card"><div class="eyebrow">Learning objectives</div><ul class="tight">'+c.objectives.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul></div>'+
       '<div class="know"><h4>Know this cold</h4><ul>'+c.know.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul></div></div></section>';
  h += '<section class="blk"><h3><span class="mono">Terms</span>Key terms and definitions</h3><dl class="terms">'+c.terms.map(function(t){return '<dt>'+t[0]+'</dt><dd>'+t[1]+'</dd>';}).join('')+'</dl></section>';
  h += '<section class="blk"><h3><span class="mono">Notes</span>Detailed study notes</h3>'+c.notes.map(function(s){
      return '<div class="sub"><h4>'+s.h+'</h4>'+s.html+(s.v?s.v.map(vis).join(''):'')+(s.tbl?table(s.tbl):'')+'</div>'; }).join('')+'</section>';
  h += '<section class="blk"><h3><span class="mono">Philippine lens</span>Applying it locally</h3><div class="grid2">'+c.ph.map(function(p){
      return '<div class="ph"><h4><span class="tag">'+p[0]+'</span></h4><p>'+p[1]+'</p></div>'; }).join('')+'</div><p class="note-src">Philippine examples are illustrative applications written for study. They are not taken from the slides, and the positioning described is an interpretation, not company data.</p></section>';
  h += '<section class="blk"><h3><span class="mono">Watch out</span>Commonly confused</h3><div class="grid2">'+c.confused.map(function(p){
      return '<div class="misc"><h4>'+p[0]+'</h4><p>'+p[1]+'</p></div>'; }).join('')+'</div></section>';
  h += '<section class="blk"><h3><span class="mono">Memory aids</span>Mnemonics and tips</h3><div class="grid2">'+c.mnemonics.map(function(p){
      return '<div class="mem"><h4>'+p[0]+'</h4><p class="m">'+p[1]+'</p><p style="margin:0;font-size:15px">'+p[2]+'</p></div>'; }).join('')+'</div></section>';

function unitOf(el){ var key=el.closest('.q').getAttribute('data-key'); return ES.units.filter(function(u){return u.key===key;})[0]; }

    var t=e.target;
    if(t.matches('[data-check]')){ reveal(t.closest('.q')); }
    if(t.matches('[data-override]')){ var k=t.getAttribute('data-override'); if(ES.res[k]){ ES.res[k].got=1; var fb=t.closest('.fb'); fb.className='fb ok'; t.remove(); updateScore(); if(ES.done) submitExamRefresh(); } }
    if(t.id==='restart2'){ ES.seed++; render(); window.scrollTo(0,0); }
    if(t.id==='wrongonly'){ $$('.q').forEach(function(b){ var r=ES.res[b.getAttribute('data-key')]; b.hidden = !r || r.got>=r.max; }); $$('.part,.casebox').forEach(function(p){p.hidden=true;}); }
  });
  }
  if(ES.mode==='exam'){ $$('[data-check]').forEach(function(b){ if(b.textContent.indexOf('Check')===0) b.hidden=true; }); }
}
function submitExamRefresh(){ var d=$('#submit'); if(d){ d.disabled=false; } var keep=ES.res; submitExam(); }

/* ---------- router ---------- */
var TABS = [['start','Start'],['ch-1','Chapters'],['cheats','Cheat sheets'],['terms','Glossary'],['exam','Practice exam']];
function render(){
  var hash = (location.hash||'#start').slice(1) || 'start';
  var view = $('#view'), cur = 'start', html = '';
  var m = hash.match(/^ch-(\d+)$/);
  if(m){ cur='ch-1'; html=chapterView(+m[1]); }
  else if(hash==='cheats'){ cur='cheats'; html=cheatView(); }
  else if(hash==='terms'){ cur='terms'; html=glossView(); }
  else if(hash==='exam'){ cur='exam'; html=examView(); }
  else { html=startView(); }
  view.innerHTML = html;
  $('#tabs').innerHTML = TABS.map(function(t){ return '<a href="#'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'>'+t[1]+'</a>'; }).join('');
  if(cur==='terms'){
    FC.deck=[]; var upd=function(){ $('#gbody').innerHTML=glossBody(); wireFC(); }; upd();
    $('#gq').addEventListener('input',function(){ FC.deck=[]; upd(); });
    $('#fcbtn').addEventListener('click',function(){ FC.on=!FC.on; FC.deck=[]; this.textContent=FC.on?'Back to list':'Flashcard mode'; upd(); });
    function wireFC(){ var f=$('#fcface'); if(!f) return;
      var flip=function(){ FC.back=!FC.back; upd(); };
      f.addEventListener('click',flip); f.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); }});
      $('#fcnext').addEventListener('click',function(){ FC.i++; FC.back=false; upd(); });
      $('#fcprev').addEventListener('click',function(){ FC.i=(FC.i-1+FC.deck.length)%FC.deck.length; FC.back=false; upd(); });
      $('#fcshuf').addEventListener('click',function(){ FC.deck=[]; upd(); }); }
  }
  if(cur==='exam') wireExam();
  document.title = 'Brand Management Reviewer';
  if(!(cur==='exam' && ES.suppressScroll)) window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-practice]');
  if(b){ ES.scope='ch-'+b.getAttribute('data-practice'); ES.seed++; location.hash='#exam'; if(location.hash==='#exam') render(); }
});
window.addEventListener('hashchange',render);
render();
})();
</script>
